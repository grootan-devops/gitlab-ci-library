.java-common:
  stage: prepare
  variables:
    MAVEN_OPTS: -Djava.awt.headless=true -Dmaven.repo.local=${CI_PROJECT_DIR}/${PROJECT_PATH}/.m2/repository
  cache:
    key:
      files:
        - pom.xml
      prefix: ${PROJECT_CACHE_KEY}
    when: always
    policy: pull
    paths:
      - ${PROJECT_PATH}/.m2
  needs:
    - job: Common:Init
      artifacts: true
      optional: true

.Java:Project:Version:Init:
  stage: .pre
  extends:
    - .lifecycle-rules
  script:
    - echo RELEASE_VERSION=$(yq -p xml -oy -r '.project.version // .project.parent.version' pom.xml) 2>&1 | tee -a version.env
  artifacts:
    name: Env File
    expose_as: Env File
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/version.env
    reports:
      dotenv: ${PROJECT_PATH}/version.env

.Java:25:
  image: ${JAVA25_BUILD_IMAGE_REPO}:${JAVA25_BUILD_IMAGE_TAG}
  extends:
    - .java-common

.Java:Dependency:Download:
  stage: prepare
  extends:
    - .java-common
    - .build-test-rules
  cache:
    policy: pull-push
  script:
    - mvn dependency:go-offline -q

.Java:Test:Unit:
  stage: test
  extends:
    - .java-common
    - .build-test-rules
  cache:
    policy: pull
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
  artifacts:
    name: Unit Test Report
    expose_as: Unit Test Report
    when: always
    expire_in: 1 week
    paths:
      - ${TEST_REPORT_DIR}/
    reports:
      junit: ${TEST_REPORT_DIR}/junit.xml
