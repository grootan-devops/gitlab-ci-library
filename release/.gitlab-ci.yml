variables:
  CONSOLIDATED_RELEASE_CHANGELOG_FILE_NAME: CONSOLIDATED_RELEASE_CHANGELOG.md
  CONSOLIDATED_README_FILE_NAME: CONSOLIDATED_README.md

.release-common:
  stage: release
  interruptible: false

.teams-adaptivecard-notification-vars:
  variables:
    MESSAGE_TEMPLATE_ADAPTIVE_CARD: |
      {
        "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
        "type": "AdaptiveCard",
        "version": "1.4",
        "fallbackText": "Release notification: $CI_PROJECT_TITLE version $TAG.",
        "speak": "Release notification for $CI_PROJECT_TITLE, version $TAG. Published by $CI_COMMIT_AUTHOR on $CI_COMMIT_TIMESTAMP. Release notes are included in this card.",
        "msteams": {
          "width": "Full"
        },
        "body": [
          {
            "type": "TextBlock",
            "text": "🚀 $CI_PROJECT_TITLE · $TAG",
            "weight": "Bolder",
            "size": "Large",
            "wrap": true,
            "maxLines": 2
          },
          {
            "type": "ColumnSet",
            "spacing": "Medium",
            "columns": [
              {
                "type": "Column",
                "width": "auto",
                "items": [
                  {
                    "type": "Image",
                    "url": "https://about.gitlab.com/images/press/gitlab-logo-500-rgb.png",
                    "size": "Small",
                    "altText": "GitLab"
                  }
                ]
              },
              {
                "type": "Column",
                "width": "stretch",
                "items": [
                  {
                    "type": "TextBlock",
                    "text": "$CI_COMMIT_AUTHOR",
                    "weight": "Bolder",
                    "size": "Default",
                    "spacing": "None",
                    "wrap": true
                  },
                  {
                    "type": "TextBlock",
                    "text": "$CI_COMMIT_TIMESTAMP",
                    "isSubtle": true,
                    "size": "Small",
                    "spacing": "None",
                    "wrap": true
                  }
                ]
              }
            ]
          },
          {
            "type": "FactSet",
            "spacing": "Small",
            "facts": [
              {
                "title": "🔖 Commit",
                "value": "$CI_COMMIT_SHA"
              },
              {
                "title": "🌿 Branch",
                "value": "$CI_COMMIT_REF_NAME"
              }
            ]
          },
          {
            "type": "TextBlock",
            "text": "📋 Release Notes",
            "weight": "Bolder",
            "size": "Medium",
            "spacing": "Medium",
            "separator": true
          },
          {
            "type": "Container",
            "id": "release-notes",
            "spacing": "Small",
            "items": []
          }
        ],
        "actions": [
          {
            "type": "Action.OpenUrl",
            "title": "🚀 Release Page",
            "url": "$CI_PROJECT_URL/-/releases/$TAG",
            "style": "positive"
          },
          {
            "type": "Action.OpenUrl",
            "title": "📂 Source Code",
            "url": "$CI_PROJECT_URL/-/tree/$TAG"
          },
          {
            "type": "Action.OpenUrl",
            "title": "📦 Release Assets",
            "url": "$CI_PROJECT_URL/-/packages?version=$TAG&orderBy=created_at&sort=desc"
          },
          {
            "type": "Action.OpenUrl",
            "title": "🔍 SonarQube",
            "url": "$SONAR_EXTERNAL_URL/dashboard?id=$CI_PROJECT_PATH_SLUG"
          }
        ]
      }

    allow_failure: true

Release:Upload:
  variables:
    GIT_DEPTH: 2
  extends:
    - .release-rules
    - .release-common
  allow_failure: true
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Image:Promote
      artifacts: false
      optional: true
    - job: Chart:Promote
      artifacts: false
      optional: true
  script:
    - echo "🔍 Searching for upstream verification artifacts for commit ${CI_COMMIT_SHA}..."
    - RESTORED_COUNT=0
    - |
      # 1. Use upstream pipeline resolved from Common:Init if present
      if [[ -z "${UPSTREAM_PIPELINE_ID}" ]]; then
        COMMIT_MSG=$(git log -1 --pretty=%B || true)
        MR_IID=$(echo "${COMMIT_MSG}" | grep -oE "MR [0-9]+" | head -n1 | tr -d 'MR ' || true)
        if [[ -z "${MR_IID}" ]]; then
          MR_IID=$(echo "${COMMIT_MSG}" | grep -oE "![0-9]+" | head -n1 | tr -d '!' || true)
        fi
        if [[ -z "${MR_IID}" ]]; then
          MR_IID=$(echo "${COMMIT_MSG}" | grep -oE "merge_requests/[0-9]+" | head -n1 | tr -d 'merge_requests/' || true)
        fi
        if [[ -z "${MR_IID}" ]]; then
          MR_JSON=$(curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits/${CI_COMMIT_SHA}/merge_requests" 2>/dev/null || true)
          MR_IID=$(echo "${MR_JSON}" | jq -r '.[0].iid // empty' 2>/dev/null || true)
          MR_SRC_SHA=$(echo "${MR_JSON}" | jq -r '.[0].sha // empty' 2>/dev/null || true)
        fi
        if [[ -n "${MR_IID}" ]]; then
          MR_REF_PIPES=$(curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines?ref=refs/merge-requests/${MR_IID}/head&status=success" 2>/dev/null || true)
          UPSTREAM_PIPELINE_ID=$(echo "${MR_REF_PIPES}" | jq -r '.[0].id // empty' 2>/dev/null || true)
        fi
        if [[ -z "${UPSTREAM_PIPELINE_ID}" && -n "${MR_SRC_SHA}" ]]; then
          SRC_PIPES_JSON=$(curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines?sha=${MR_SRC_SHA}&status=success" 2>/dev/null || true)
          UPSTREAM_PIPELINE_ID=$(echo "${SRC_PIPES_JSON}" | jq -r '.[0].id // empty' 2>/dev/null || true)
        fi
        if [[ -z "${UPSTREAM_PIPELINE_ID}" ]]; then
          RECENT_PIPES=$(curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines?status=success&per_page=10" 2>/dev/null || true)
          UPSTREAM_PIPELINE_ID=$(echo "${RECENT_PIPES}" | jq -r '[.[] | select(.source=="merge_request_event")][0].id // empty' 2>/dev/null || true)
        fi
      fi
    - |
      # 2. If an upstream pipeline is identified, inspect jobs and download artifacts
      if [[ -n "${UPSTREAM_PIPELINE_ID}" ]]; then
        echo "📥 Found upstream verification pipeline #${UPSTREAM_PIPELINE_ID}: ${CI_PROJECT_URL}/-/pipelines/${UPSTREAM_PIPELINE_ID}"
        JOBS_JSON=$(curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${UPSTREAM_PIPELINE_ID}/jobs?per_page=100" 2>/dev/null || true)

        if [[ -n "${JOBS_JSON}" ]]; then
          JOB_ROWS=$(echo "${JOBS_JSON}" | jq -r '.[] | "\(.id)|\(.name)|\(.stage)|\(.status)|\(if .artifacts_file != null then "yes" else "no" end)"')
          while IFS='|' read -r JOB_ID JOB_NAME JOB_STAGE JOB_STATUS HAS_ARTIFACTS; do
            if [[ -z "${JOB_ID}" ]]; then
              continue
            fi
            JOB_URL="${CI_PROJECT_URL}/-/jobs/${JOB_ID}"

            if [[ "${HAS_ARTIFACTS}" == "yes" ]]; then
              if curl --silent --location --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --output "job_${JOB_ID}_artifacts.zip" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${JOB_ID}/artifacts" 2>/dev/null; then
                if unzip -o -q "job_${JOB_ID}_artifacts.zip" 2>/dev/null; then
                  RESTORED_COUNT=$((RESTORED_COUNT + 1))
                  echo "  ✅ [${JOB_STAGE}] ${JOB_NAME} (#${JOB_ID}) - Artifacts restored: ${JOB_URL}"
                fi
                rm -f "job_${JOB_ID}_artifacts.zip"
              fi
            else
              echo "  ⚠️ [${JOB_STAGE}] ${JOB_NAME} (#${JOB_ID}) status='${JOB_STATUS}' (no artifacts)"
            fi
          done <<< "${JOB_ROWS}"
        fi
        echo "✅ Restored artifacts from ${RESTORED_COUNT} upstream jobs."
      fi
    - |
      if [[ ${RESTORED_COUNT} -eq 0 ]]; then
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        if [[ -n "${UPSTREAM_PIPELINE_ID}" ]]; then
          echo "⚠️  WARNING: Upstream pipeline #${UPSTREAM_PIPELINE_ID} has no downloadable artifacts!"
        else
          echo "⚠️  WARNING: No upstream verification pipeline found for commit ${CI_COMMIT_SHA}."
        fi
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      fi
    - FAILED_UPLOADS=()
    - |
      file_upload () {
        local FILE=$1

        if [[ ! -f "${FILE}" ]]; then
          echo "⚠️ WARNING: ${FILE} does not exist."
          FAILED_UPLOADS+=("${FILE}")
          return 1
        fi

        echo "📦 Uploading ${FILE} to generic package registry..."
        if ! curl --fail -L --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "${FILE}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/release-assets/${TAG}/${FILE}" ; then
          echo "❌ ERROR: Failed to upload ${FILE}"
          FAILED_UPLOADS+=("${FILE}")
        else
          echo "✅ Uploaded ${FILE} successfully to package registry (version ${TAG})"
        fi
      }
    - |
      # 1. Trivy scan report bundle
      TRIVY_REPORTS=( *_${TRIVY_SCAN_REPORT_NAME_SUFFIX}.* )
      if [[ -f "${TRIVY_REPORTS[0]}" ]]; then
        tar -czf "${TRIVY_SCAN_REPORT_FILE_NAME}" "${TRIVY_REPORTS[@]}" 2>/dev/null || true
        file_upload "${TRIVY_SCAN_REPORT_FILE_NAME}"
      fi
    - |
      # 2. Installed packages / SBOM
      if [[ -f "${INSTALLED_PCKG_FILE_NAME}" ]]; then
        file_upload "${INSTALLED_PCKG_FILE_NAME}"
      fi
      if [[ -f "sbom.cdx.json" ]]; then
        file_upload "sbom.cdx.json"
      fi
    - |
      # 3. Helm chart package
      CHART_TGZ_FILES=( ${CHART_NAME}-*.tgz )
      if [[ -f "${CHART_TGZ_FILES[0]}" ]]; then
        if [[ ! -f "${CHART_NAME}-${TAG}.tgz" ]]; then
          cp "${CHART_TGZ_FILES[0]}" "${CHART_NAME}-${TAG}.tgz"
        fi
        file_upload "${CHART_NAME}-${TAG}.tgz"
      fi
    - |
      # 4. Test reports directory
      if [[ -d "${TEST_REPORT_DIR}" ]]; then
        tar -czf "${TEST_REPORT_DIR}.tar.gz" "${TEST_REPORT_DIR}"
        file_upload "${TEST_REPORT_DIR}.tar.gz"
      fi
    - |
      # 5. Additional release artifacts
      for ITEM in ${ADDITIONAL_RELEASE_ARTIFACT}; do
        if [[ -f "${ITEM}" ]]; then
          file_upload "${ITEM}"
        elif [[ -d "${ITEM}" ]]; then
          TAR_FILE="${ITEM}.tar.gz"
          tar -czf "${TAR_FILE}" -C "$(dirname "${ITEM}")" "$(basename "${ITEM}")"
          file_upload "${TAR_FILE}"
        fi
      done
    - |
      if [[ ${#FAILED_UPLOADS[@]} -gt 0 ]]; then
        echo "❌ The following files failed to upload:"
        for FILE in "${FAILED_UPLOADS[@]}"; do
          echo "- ${FILE}"
        done
        exit 1
      fi
  artifacts:
    when: on_success
    expire_in: 1 week
    paths:
      - "${IMAGE_INFO_FILE_NAME}"
      - "${IMAGE_CVE_INFO_FILE_NAME}"
      - "${IMAGE_CVE_REPORT_FILE_NAME}"
      - "${CHART_INFO_FILE_NAME}"
      - "${CHART_CVE_INFO_FILE_NAME}"
      - "${TF_CVE_INFO_FILE_NAME}"
      - "${LICENSE_INFO_FILE_NAME}"
      - "${SBOM_CVE_INFO_FILE_NAME}"
      - "${RELEASE_CHANGELOG_FILE_NAME}"
      - "${RELEASE_MIGRATION_FILE_NAME}"

Release:
  extends:
    - .release-rules
    - .release-common
  needs:
    - job: Release:Upload
      artifacts: true
      optional: false
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Migration:Check Existence
      artifacts: true
      optional: true
  script:
    - |
      asset_json () {
        echo "{\"name\":\"${1}\",\"url\":\"${2}\"}"
      }
    - ASSET_LINKS=()
    - |
      touch "${CONSOLIDATED_RELEASE_CHANGELOG_FILE_NAME}"
      for FILE in "${IMAGE_INFO_FILE_NAME}" "${IMAGE_CVE_INFO_FILE_NAME}" "${IMAGE_CVE_REPORT_FILE_NAME}"; do
        if [[ -f "${FILE}" ]]; then
          cat "${FILE}" >> "${IMAGE_README_MD_FILE_NAME}"
        fi
      done
    - |
      for FILE in "${CHART_INFO_FILE_NAME}" "${CHART_CVE_INFO_FILE_NAME}"; do
        if [[ -f "${FILE}" ]]; then
          cat "${FILE}" >> "${CHART_README_MD_FILE_NAME}"
        fi
      done
    - |
      for FILE in "${TF_CVE_INFO_FILE_NAME}"; do
        if [[ -f "${FILE}" ]]; then
          cat "${FILE}" >> "${TF_README_MD_FILE_NAME}"
        fi
      done
    - |
      for FILE in "${IMAGE_README_MD_FILE_NAME}" "${CHART_README_MD_FILE_NAME}" "${TF_README_MD_FILE_NAME}" "${LICENSE_INFO_FILE_NAME}" "${SBOM_CVE_INFO_FILE_NAME}"; do
        if [[ -f "${FILE}" ]]; then
          cat "${FILE}" >> ${CONSOLIDATED_README_FILE_NAME}
        fi
      done
    - |
      for FILE in "${RELEASE_CHANGELOG_FILE_NAME}" "${RELEASE_MIGRATION_FILE_NAME}" "${CONSOLIDATED_README_FILE_NAME}"; do
        if [[ -f "${FILE}" && -s "${FILE}" ]]; then
          echo "" >> "${CONSOLIDATED_RELEASE_CHANGELOG_FILE_NAME}"
          cat "${FILE}" >> "${CONSOLIDATED_RELEASE_CHANGELOG_FILE_NAME}"
          echo "" >> "${CONSOLIDATED_RELEASE_CHANGELOG_FILE_NAME}"
        fi
      done
    - |
      EXISTING_RELEASE=$(curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${TAG}" 2>/dev/null || true)
      if [[ -n "${EXISTING_RELEASE}" && "$(echo "${EXISTING_RELEASE}" | jq -r '.tag_name // empty' 2>/dev/null)" == "${TAG}" ]]; then
        echo "⚠️ Release ${TAG} already exists. Updating release description..."
        curl --silent --fail --request PUT --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{\"description\": $(jq -Rs . < "${CONSOLIDATED_RELEASE_CHANGELOG_FILE_NAME}")}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${TAG}" >/dev/null 2>&1 || true
        echo "✅ Release ${TAG} updated successfully."
      else
        release-cli create --name "Release ${TAG}" --description "$(cat ${CONSOLIDATED_RELEASE_CHANGELOG_FILE_NAME})" --tag-name "${TAG}" --ref "${CI_COMMIT_SHA}" --assets-link "$(asset_json "📦 Release Package" "${CI_PROJECT_URL}/-/packages?version=${TAG}&orderBy=created_at&sort=desc")" --assets-link "$(asset_json "🔍 SonarQube" "${SONAR_EXTERNAL_URL:-${SONAR_URL}}/dashboard?id=${CI_PROJECT_PATH_SLUG}")" "${ASSET_LINKS[@]}"
      fi
  artifacts:
    name: Release Descriptions
    expose_as: Release Descriptions
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${IMAGE_README_MD_FILE_NAME}
      - ${PROJECT_PATH}/${CHART_README_MD_FILE_NAME}
      - ${PROJECT_PATH}/${TF_README_MD_FILE_NAME}
      - ${PROJECT_PATH}/${RELEASE_CHANGELOG_FILE_NAME}
      - ${PROJECT_PATH}/${RELEASE_MIGRATION_FILE_NAME}
      - ${PROJECT_PATH}/${RELEASE_CHANGELOG_CARD_FILE_NAME}
      - ${PROJECT_PATH}/${CONSOLIDATED_RELEASE_CHANGELOG_FILE_NAME}

Release:Notification:Teams:
  stage: notify
  script:
    - echo "${MESSAGE_TEMPLATE_ADAPTIVE_CARD}" > message_template.json
    - |
      if [[ ! -s "${RELEASE_CHANGELOG_CARD_FILE_NAME}" ]]; then
        if [[ -f "${RELEASE_CHANGELOG_FILE_NAME}" ]]; then
          jq -R -s -c '
            def clean_text: sub("\r$"; "") | gsub("[ \t]+"; " ") | sub("^ +"; "") | sub(" +$"; "");
            split("\n") | reduce .[] as $line (
              [];
              if ($line | startswith("### ")) then
                . + [{
                  type: "TextBlock",
                  text: ($line | sub("^### +"; "") | clean_text),
                  weight: "Bolder",
                  size: "Default",
                  spacing: "Medium",
                  wrap: true
                }]
              elif ($line | startswith("- ")) then
                . + [{
                  type: "TextBlock",
                  text: ("• " + ($line | sub("^- +"; "") | clean_text)),
                  spacing: "Small",
                  wrap: true
                }]
              elif ($line | length == 0) then .
              else
                . + [{
                  type: "TextBlock",
                  text: ($line | clean_text),
                  spacing: "Small",
                  wrap: true
                }]
              end
            )
          ' "${RELEASE_CHANGELOG_FILE_NAME}" > "${RELEASE_CHANGELOG_CARD_FILE_NAME}" 2>/dev/null || echo "[]" > "${RELEASE_CHANGELOG_CARD_FILE_NAME}"
        else
          echo "[]" > "${RELEASE_CHANGELOG_CARD_FILE_NAME}"
        fi
      fi
    - |
      jq --slurpfile release_notes "${RELEASE_CHANGELOG_CARD_FILE_NAME}" '
        .["$schema"] = "http://adaptivecards.io/schemas/adaptive-card.json"
        | del(.[""])
        | (.body[] | select(.id == "release-notes") | .items) = ($release_notes[0] // [])
        | {
            type: "message",
            attachments: [
              {
                contentType: "application/vnd.microsoft.card.adaptive",
                content: .
              }
            ]
          }
      ' message_template.json > message.json
    - |
      if [[ -z "${RELEASE_MESSAGE_TEAMS_WORKFLOWS_URL}" ]]; then
        echo "⚠️ Notice: RELEASE_MESSAGE_TEAMS_WORKFLOWS_URL is not set or empty. Skipping sending notification."
        exit 0
      fi
    - IFS=',' read -r -a WEBHOOKS <<< "${RELEASE_MESSAGE_TEAMS_WORKFLOWS_URL}"
    - |
      SENT_COUNT=0
      for URL in "${WEBHOOKS[@]}"; do
        CLEAN_URL="$(printf '%s' "${URL}" | xargs)"

        if [ -z "${CLEAN_URL}" ]; then
          continue
        fi

        echo "Sending notification to Teams Workflow..."

        if ! HTTP_CODE="$(
          curl -sS \
            -o /dev/null \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @message.json \
            "${CLEAN_URL}"
        )"; then
          echo "ERROR: Could not reach Teams Workflow endpoint."
          exit 1
        fi

        case "${HTTP_CODE}" in
          2??)
            echo "✅ Teams Workflow accepted the payload: HTTP ${HTTP_CODE}"
            SENT_COUNT=$((SENT_COUNT + 1))
            ;;
          *)
            echo "ERROR: Teams Workflow rejected the payload: HTTP ${HTTP_CODE}"
            exit 1
            ;;
        esac
      done
      if [[ ${SENT_COUNT} -eq 0 ]]; then
        echo "⚠️ Notice: No valid webhook URLs provided in RELEASE_MESSAGE_TEAMS_WORKFLOWS_URL."
      fi
  extends:
    - .release-rules
    - .teams-adaptivecard-notification-vars
    - .release-common
  artifacts:
    name: Teams Notification Adaptive Card JSON Body
    expose_as: Teams Notification Adaptive Card JSON Body
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/message.json
  needs:
    - job: Release
      artifacts: true
      optional: true
    - job: Release:Upload
      artifacts: true
      optional: true
    - job: Common:Init
      artifacts: true
      optional: false
