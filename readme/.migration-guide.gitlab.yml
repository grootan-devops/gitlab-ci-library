Migration:Lint:
  stage: lint
  variables:
    LINT_MD_FILES: ${MIGRATION_FILE_NAME}
  extends:
    - .MD:Lint
    - .check-job-common
    - .lint-workflow-rules

Migration:Check Existence:
  stage: check
  allow_failure: false
  extends:
    - .check-job-common
    - .skip-on-master-rules
  script:
    - echo "🔍 Verifying migration requirements for release version ${RELEASE_VERSION}..."
    - |
      if [[ -z "${RELEASE_VERSION}" ]]; then
        echo "❌ ERROR: RELEASE_VERSION is not defined."
        exit 1
      fi

      CURRENT_MAJOR=$(echo "${RELEASE_VERSION}" | grep -Eo '^[0-9]+' || true)
      if [[ -z "${CURRENT_MAJOR}" ]]; then
        echo "❌ ERROR: Could not parse major version from RELEASE_VERSION='${RELEASE_VERSION}'."
        exit 1
      fi

      # 1. Discover previous release version
      if [[ -z "${PREVIOUS_RELEASE_VERSION}" ]]; then
        # Try querying GitLab API
        if [[ -n "${CI_API_V4_URL}" && -n "${CI_PROJECT_ID}" && -n "${CI_JOB_TOKEN}" ]]; then
          TAGS_JSON=$(curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags?per_page=100" 2>/dev/null || true)
          if [[ -n "${TAGS_JSON}" ]]; then
            API_TAGS=$(echo "${TAGS_JSON}" | jq -r '.[].name // empty' 2>/dev/null || true)
          fi
        fi

        # Fall back to local git tags
        GIT_TAGS=$(git tag -l 2>/dev/null || true)
        if [[ -z "${GIT_TAGS}" ]]; then
          git fetch --tags --depth=50 origin 2>/dev/null || true
          GIT_TAGS=$(git tag -l 2>/dev/null || true)
        fi

        # Filter valid semver tags and exclude current release version
        ALL_TAGS=$(printf "%s\n%s\n" "${API_TAGS}" "${GIT_TAGS}" | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+' | sed 's/^v//' | grep -v "^${RELEASE_VERSION}$" | sort -uV || true)
        PREVIOUS_RELEASE_VERSION=$(echo "${ALL_TAGS}" | tail -n 1 || true)
      fi

      echo "ℹ️ Target Release Version: ${RELEASE_VERSION} (Major: ${CURRENT_MAJOR})"
      echo "ℹ️ Previous Release Version: ${PREVIOUS_RELEASE_VERSION:-none}"

      # 2. Check if this is the initial project release
      if [[ -z "${PREVIOUS_RELEASE_VERSION}" ]]; then
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "ℹ️ Notice: No previous release found in repository. Initial release detected."
        echo "Migration guide check is skipped for initial release."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        exit 0
      fi

      PREVIOUS_MAJOR=$(echo "${PREVIOUS_RELEASE_VERSION}" | grep -Eo '^[0-9]+' || true)

      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      echo "🔍 Verifying migration documentation: ${PREVIOUS_RELEASE_VERSION} -> ${RELEASE_VERSION}"
      echo "Every release (major, minor, or patch) requires documented migration/compatibility notes in ${MIGRATION_FILE_NAME}."
      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      # 3. Ensure MIGRATION_FILE_NAME exists
      if [[ ! -f "${MIGRATION_FILE_NAME}" ]]; then
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🛑 [HARD FAILURE] Pipeline blocked: Migration file '${MIGRATION_FILE_NAME}' is missing!"
        echo "Release (${PREVIOUS_RELEASE_VERSION} -> ${RELEASE_VERSION}) cannot proceed without ${MIGRATION_FILE_NAME}."
        echo "Please create ${MIGRATION_FILE_NAME} and document migration steps (or state 'No migration required')."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        exit 1
      fi

      # 4. Extract migration section matching previous version and current version
      awk -v p_ver="${PREVIOUS_RELEASE_VERSION}" \
          -v p_maj="${PREVIOUS_MAJOR}" \
          -v c_ver="${RELEASE_VERSION}" \
          -v c_maj="${CURRENT_MAJOR}" '
        BEGIN {
          gsub(/\./, "\\.", p_ver);
          gsub(/\./, "\\.", c_ver);
          re_range = "^##[[:space:]]+(Release[[:space:]]+)?v?" p_ver "[[:space:]]*(\\.\\.\\.|\\.\\.|\\->|to)[[:space:]]*v?" c_ver "([[:space:]]|$)";
          re_single = "^##[[:space:]]+(Release[[:space:]]+)?v?" c_ver "([[:space:]]|$)";
          re_major = "^##[[:space:]]+(Release[[:space:]]+)?v?" p_maj "(\\.x|\\.[0-9]+)*[[:space:]]*(\\.\\.\\.|\\.\\.|\\->|to)[[:space:]]*v?" c_maj "(\\.x|\\.[0-9]+)*([[:space:]]|$)";
        }
        {
          clean_line = $0;
          gsub(/[`\[\]]/, "", clean_line);
        }
        clean_line ~ re_range || clean_line ~ re_single || (p_maj != c_maj && clean_line ~ re_major) {
          found = 1;
          p = 1;
          print;
          next;
        }
        p && /^##[[:space:]]+/ {
          exit;
        }
        p {
          print;
        }
        END {
          if (!found) exit 2;
        }
      ' "${MIGRATION_FILE_NAME}" > "${RELEASE_MIGRATION_FILE_NAME}" || AWK_EXIT=$?

      if [[ "${AWK_EXIT:-0}" -eq 2 || ! -s "${RELEASE_MIGRATION_FILE_NAME}" ]]; then
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🛑 [HARD FAILURE] Pipeline blocked: Missing migration entry in ${MIGRATION_FILE_NAME}!"
        echo "Release bump (${PREVIOUS_RELEASE_VERSION} -> ${RELEASE_VERSION}) strictly requires a migration entry in ${MIGRATION_FILE_NAME}."
        echo ""
        echo "Required Action: Add a section to ${MIGRATION_FILE_NAME} with the following heading:"
        echo "## [${PREVIOUS_RELEASE_VERSION}...${RELEASE_VERSION}] - $(date +%Y-%m-%d)"
        echo ""
        echo "Ensure it includes:"
        echo "  - Summary of changes and upgrade instructions (or state 'No migration required')"
        echo "  - Breaking changes or parameter renames (if any)"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        exit 1
      fi

      # 5. Verify the extracted section contains substantive content (at least 1 non-empty body line)
      BODY_LINES=$(grep -v "^##" "${RELEASE_MIGRATION_FILE_NAME}" | grep -c '[^[:space:]]' || true)
      if [[ "${BODY_LINES}" -lt 1 ]]; then
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "🛑 [HARD FAILURE] Pipeline blocked: Incomplete migration section in ${MIGRATION_FILE_NAME}!"
        echo "The section for ${PREVIOUS_RELEASE_VERSION}...${RELEASE_VERSION} lacks content. At minimum, state 'No migration required'."
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        exit 1
      fi

      echo "✅ Successfully verified and extracted migration guide for ${PREVIOUS_RELEASE_VERSION}...${RELEASE_VERSION}:"
      cat "${RELEASE_MIGRATION_FILE_NAME}"
  artifacts:
    name: Release Migration Guide
    expose_as: Release Migration Guide
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${RELEASE_MIGRATION_FILE_NAME}
