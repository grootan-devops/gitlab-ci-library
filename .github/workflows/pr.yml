name: CI · PR Verification
run-name: "CI · ${{ github.event_name }} · ${{ github.sha }}"

on:
  pull_request:
    branches: [main]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  init:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: grootan-devops/github-ci-library/.github/workflows/init.yml@1.7.0
    secrets: inherit
    with:
      ignore-docker: "true"
      ignore-chart: "true"

  lint:
    uses: grootan-devops/github-ci-library/.github/workflows/lint.yml@1.7.0
    secrets: inherit
    with:
      lint-md-files: "**/*.md"

  script-types:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-26.04' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check GitLab script entries are strings
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'import yaml' 2>/dev/null || sudo apt-get install -y python3-yaml
          git ls-files -z '*.yml' '*.yaml' ':!:.github/**' | xargs -0 /usr/bin/python3 .github/scripts/check_script_types.py

  check:
    needs: init
    uses: grootan-devops/github-ci-library/.github/workflows/check.yml@1.7.0
    secrets: inherit
    with:
      tag: ${{ needs.init.outputs.tag }}
  secret-scan:
    uses: grootan-devops/github-ci-library/.github/workflows/secret-scanning.yml@1.7.0
    secrets: inherit
    with:
      full-history: false
