spec:
  inputs:
    environment:
      type: string
      description: "Target environment name (e.g. dev, staging, production)"
    gitops_repo_url:
      type: string
      description: "GitOps repository clone URL"
    gitops_branch:
      type: string
      description: "GitOps branch to update (defaults to environments/<env>)"
    gitops_chart_values_file:
      type: string
      default: ""
      description: "Relative path to values.yaml in GitOps repository"
    gitops_chart_app_yq_path:
      type: string
      default: ""
      description: "yq path to application chart entry (e.g. .apps.strapi)"
    gitops_image_values_file:
      type: string
      default: ""
      description: "Optional separate image values.yaml path"
    gitops_image_repo_yq_path:
      type: string
      default: ""
      description: "Optional yq path to update image repository"
    gitops_image_tag_yq_path:
      type: string
      default: ""
      description: "Optional yq path to update image tag"
    gitops_manifest_file:
      type: string
      default: ""
      description: "Path to Kubernetes YAML manifest file (if deploying raw manifests)"
    gitops_new_image:
      type: string
      default: ""
      description: "Explicit new image string to set in Kubernetes manifest (optional)"
    argocd_server:
      type: string
      default: ""
      description: "ArgoCD server URL (e.g. https://argocd.example.com). If empty, defaults to ARGOCD_SERVER CI/CD variable"
    argocd_token:
      type: string
      default: ""
      description: "ArgoCD auth token (defaults to ARGOCD_TOKEN CI/CD variable)"
    argocd_apps:
      type: string
      default: ""
      description: "ArgoCD application name to sync, space seperated list."
    argocd_sync_timeout:
      type: number
      default: 600
      description: "Timeout in seconds to wait for ArgoCD sync and health"
    environment_url:
      type: string
      default: ""
      description: "Optional URL for the deployed environment (e.g. https://myapp.example.com)"
    environment_action:
      type: string
      default: "start"
      description: "GitLab environment action (start, prepare, stop, verify, access)"
    validate_image:
      type: boolean
      default: true
      description: "Verify the target container image exists before deploying. Set false when the deployed chart does not use an image built by this project."
    gitops_repo_username:
      type: string
      default: ""
      description: "Username for cloning and pushing the GitOps repository with gitops_repo_token (defaults to GITOPS_REPO_USERNAME, then oauth2)"
    gitops_repo_token:
      type: string
      default: ""
      description: "Token for cloning and pushing the GitOps repository, e.g. a project access token with write_repository (defaults to GITOPS_REPO_TOKEN; CI_JOB_TOKEN when both are empty)"
---

.Deploy:ArgoCD:Chart:Repository:
  script:
    - |
      argocd_chart_repository() {
        if [[ "${TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          ARGOCD_CHART_CHANNEL="stable"
          ARGOCD_CHART_OCI_REPOSITORY="${CHART_REPOSITORY}"
        else
          ARGOCD_CHART_CHANNEL="dev"
          ARGOCD_CHART_OCI_REPOSITORY="${CHART_REPOSITORY}${CHART_DEV_REPOSITORY_SUFFIX-/dev}"
        fi
        case "${CHART_REGISTRY}" in
          docker.io|index.docker.io|registry-1.docker.io) ARGOCD_CHART_OCI_REPOSITORY="${CHART_REPOSITORY}" ;;
        esac
        ARGOCD_CHART_CHANNEL="${HELM_CHANNEL:-${ARGOCD_CHART_CHANNEL}}"
      }

Deploy:ArgoCD:Validate:Chart:$[[ inputs.environment ]]:
  stage: check
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW == "deploy" && "$[[ inputs.gitops_chart_app_yq_path ]]" != "" && ($DEPLOY_TARGET == "argocd-$[[ inputs.environment ]]" || $DEPLOY_TARGET == "$[[ inputs.environment ]]-argocd" || $DEPLOY_TARGET == "$[[ inputs.environment ]]")'
    - when: never
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
  script:
    - CHART_USER="${CHART_REGISTRY_USERNAME:-${CI_REGISTRY_USER:-gitlab-ci-token}}"
    - CHART_PASS="${CHART_REGISTRY_PASSWORD:-${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}}"
    - |
      if [[ -n "${CHART_USER}" && -n "${CHART_PASS}" && -n "${CHART_REGISTRY}" ]]; then
        echo "${CHART_PASS}" | helm registry login "${CHART_REGISTRY}" --username "${CHART_USER}" --password-stdin
      fi
    - !reference [.Deploy:ArgoCD:Chart:Repository, script]
    - |
      RESOLVED_CHART_NAME="${CHART_NAME}"
      if [[ -z "${RESOLVED_CHART_NAME}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        RESOLVED_CHART_NAME=$(yq '.name // ""' "${CHART_DIR}/${CHART_FILE}" 2>/dev/null || true)
      fi
      argocd_chart_repository
      CHART_VERIFY_REPO="${ARGOCD_CHART_OCI_REPOSITORY}"
    - |
      if [[ -n "${CHART_REGISTRY}" ]]; then
        if [[ -n "${RESOLVED_CHART_NAME}" ]] && helm show chart "oci://${CHART_REGISTRY}/${CHART_VERIFY_REPO}/${RESOLVED_CHART_NAME}" --version "${TARGET_VERSION}" > /dev/null 2>&1; then
          echo "✅ Helm chart '${RESOLVED_CHART_NAME}:${TARGET_VERSION}' verified in registry (${CHART_VERIFY_REPO})."
        elif helm show chart "oci://${CHART_REGISTRY}/${CHART_VERIFY_REPO}" --version "${TARGET_VERSION}" > /dev/null 2>&1; then
          echo "✅ Helm chart version '${TARGET_VERSION}' verified in registry (${CHART_VERIFY_REPO})."
        else
          echo "❌ ERROR: Helm chart '${RESOLVED_CHART_NAME:-chart}:${TARGET_VERSION}' does not exist in registry (${CHART_VERIFY_REPO})."
          exit 1
        fi
      elif [[ -n "${CI_API_V4_URL}" && -n "${CI_PROJECT_ID}" && -n "${CI_JOB_TOKEN}" ]]; then
        CHART_CHANNEL_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/${ARGOCD_CHART_CHANNEL}"
        if helm repo add argocd-target "${CHART_CHANNEL_URL}" --force-update \
             --username gitlab-ci-token --password "${CI_JOB_TOKEN}" > /dev/null 2>&1 \
           && helm show chart "argocd-target/${RESOLVED_CHART_NAME}" --version "${TARGET_VERSION}" > /dev/null 2>&1; then
          echo "✅ Helm chart '${RESOLVED_CHART_NAME}:${TARGET_VERSION}' verified in GitLab Helm channel '${ARGOCD_CHART_CHANNEL}'."
        else
          echo "❌ ERROR: Helm chart '${RESOLVED_CHART_NAME}:${TARGET_VERSION}' does not exist in GitLab Helm channel '${ARGOCD_CHART_CHANNEL}'."
          exit 1
        fi
      fi

Deploy:ArgoCD:Validate:Image:$[[ inputs.environment ]]:
  stage: check
  extends:
    - .image-common
    - .image-registry-login
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW == "deploy" && "$[[ inputs.validate_image ]]" == "true" && ($DEPLOY_TARGET == "argocd-$[[ inputs.environment ]]" || $DEPLOY_TARGET == "$[[ inputs.environment ]]-argocd" || $DEPLOY_TARGET == "$[[ inputs.environment ]]")'
    - when: never
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
  before_script:
    - |
      # Same GitLab registry defaults as Common:Init, which does not run for WORKFLOW=deploy.
      if [[ -z "${IMAGE_REGISTRY}" && ( -n "${CI_REGISTRY}" || "${GITLAB_CI}" == "true" ) ]]; then
        IMAGE_REGISTRY="${CI_REGISTRY}"
        if [[ -z "${IMAGE_REPOSITORY}" || "${IMAGE_REPOSITORY}" != "${CI_PROJECT_PATH}"* ]]; then
          IMAGE_REPOSITORY="${CI_PROJECT_PATH}"
        fi
      fi
      export IMAGE_REGISTRY IMAGE_REPOSITORY
    - !reference [.image-registry-login, before_script]
  script:
    - |
      if [[ -n "$[[ inputs.gitops_new_image ]]" ]]; then
        TARGET_IMG="$[[ inputs.gitops_new_image ]]"
      else
        if [[ -z "${IMAGE_REGISTRY}" || -z "${IMAGE_REPOSITORY}" ]]; then
          echo "❌ ERROR: IMAGE_REGISTRY and IMAGE_REPOSITORY must be set to verify the target image (or set gitops_new_image, or validate_image: false)."
          exit 1
        fi
        if [[ "${TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          IMAGE_TARGET_REPO="${IMAGE_REPOSITORY}"
        else
          IMAGE_TARGET_REPO="${IMAGE_REPOSITORY}${IMAGE_DEV_REPOSITORY_SUFFIX}"
        fi
        TARGET_IMG="${IMAGE_REGISTRY}/${IMAGE_TARGET_REPO}:${TARGET_VERSION}"
      fi
    - |
      if docker manifest inspect "${TARGET_IMG}" > /dev/null 2>&1; then
        echo "✅ Container image '${TARGET_IMG}' verified in registry."
      else
        echo "❌ ERROR: Container image '${TARGET_IMG}' does not exist in registry."
        exit 1
      fi

Deploy:ArgoCD:$[[ inputs.environment ]]:
  stage: deploy
  interruptible: false
  environment:
    name: $[[ inputs.environment ]]
    url: $[[ inputs.environment_url ]]
    action: $[[ inputs.environment_action ]]
  variables:
    GITOPS_REPO_URL: "$[[ inputs.gitops_repo_url ]]"
    GITOPS_BRANCH: "$[[ inputs.gitops_branch ]]"
    GITOPS_TARGET_DIR: _gitops_repo
    GITOPS_CHART_VALUES_FILE: "$[[ inputs.gitops_chart_values_file ]]"
    GITOPS_CHART_APP_YQ_PATH: "$[[ inputs.gitops_chart_app_yq_path ]]"
    GITOPS_IMAGE_VALUES_FILE: "$[[ inputs.gitops_image_values_file ]]"
    GITOPS_IMAGE_REPO_YQ_PATH: "$[[ inputs.gitops_image_repo_yq_path ]]"
    GITOPS_IMAGE_TAG_YQ_PATH: "$[[ inputs.gitops_image_tag_yq_path ]]"
    GITOPS_MANIFEST_FILE: "$[[ inputs.gitops_manifest_file ]]"
    GITOPS_NEW_IMAGE: "$[[ inputs.gitops_new_image ]]"
    ARGOCD_INPUT_SERVER: "$[[ inputs.argocd_server ]]"
    ARGOCD_INPUT_TOKEN: "$[[ inputs.argocd_token ]]"
    ARGOCD_APPS: "$[[ inputs.argocd_apps ]]"
    ARGOCD_SYNC_TIMEOUT: $[[ inputs.argocd_sync_timeout ]]
    GITOPS_INPUT_REPO_USERNAME: "$[[ inputs.gitops_repo_username ]]"
    GITOPS_INPUT_REPO_TOKEN: "$[[ inputs.gitops_repo_token ]]"
    GITOPS_GIT_USERNAME: gitlab-ci
    GITOPS_GIT_EMAIL: gitlab-ci@gitlab.com
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW == "deploy" && ($DEPLOY_TARGET == "argocd-$[[ inputs.environment ]]" || $DEPLOY_TARGET == "$[[ inputs.environment ]]-argocd" || $DEPLOY_TARGET == "$[[ inputs.environment ]]")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW == "full-pipeline"'
      when: manual
      allow_failure: true
    - when: never
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Chart:Push
      artifacts: false
      optional: true
    - job: Image:Push
      artifacts: false
      optional: true
    - job: Deploy:ArgoCD:Validate:Chart:$[[ inputs.environment ]]
      artifacts: false
      optional: true
    - job: Deploy:ArgoCD:Validate:Image:$[[ inputs.environment ]]
      artifacts: false
      optional: true
  script:
    - TARGET_VERSION="${TARGET_VERSION:-${APP_PUSH_VERSION:-${CHART_PUSH_VERSION:-${TAG}}}}"
    - !reference [.Deploy:ArgoCD:Chart:Repository, script]
    - ARGOCD_SERVER="${ARGOCD_INPUT_SERVER:-${ARGOCD_SERVER}}"
    - ARGOCD_TOKEN="${ARGOCD_INPUT_TOKEN:-${ARGOCD_TOKEN}}"
    - MISSING=()
    - |
      [[ -z "${TARGET_VERSION}" ]] && MISSING+=("TARGET_VERSION (or APP_PUSH_VERSION / TAG)")
      [[ -z "${GITOPS_REPO_URL}" ]] && MISSING+=("gitops_repo_url")
      [[ -z "${GITOPS_BRANCH}" ]] && MISSING+=("gitops_branch")
      [[ -z "${ARGOCD_SERVER}" ]] && MISSING+=("argocd_server (or ARGOCD_SERVER)")
      [[ -z "${ARGOCD_TOKEN}" ]] && MISSING+=("argocd_token (or ARGOCD_TOKEN)")
      [[ -z "${ARGOCD_APPS}" ]] && MISSING+=("argocd_apps")
      if [[ ${#MISSING[@]} -gt 0 ]]; then
        echo "❌ [HARD FAILURE] Missing mandatory deployment configuration: ${MISSING[*]}"
        exit 1
      fi

      # Deployment mode validation
      if [[ -z "${GITOPS_CHART_VALUES_FILE}" && -z "${GITOPS_MANIFEST_FILE}" ]]; then
        echo "❌ [HARD FAILURE] Either gitops_chart_values_file (for Helm) or gitops_manifest_file (for Manifest) must be configured."
        exit 1
      fi

      if [[ -n "${GITOPS_CHART_VALUES_FILE}" && -n "${GITOPS_MANIFEST_FILE}" ]]; then
        echo "❌ [HARD FAILURE] Both gitops_chart_values_file and gitops_manifest_file are defined. Choose either Helm or Manifest deployment."
        exit 1
      fi

      # 1. Helm-based validation
      if [[ -n "${GITOPS_CHART_VALUES_FILE}" ]]; then
        if [[ -z "${GITOPS_CHART_APP_YQ_PATH}" ]]; then
          echo "❌ [HARD FAILURE] gitops_chart_app_yq_path is mandatory when gitops_chart_values_file is specified."
          exit 1
        fi
        if [[ -n "${GITOPS_IMAGE_VALUES_FILE}" ]]; then
          HELM_IMG_MISSING=()
          [[ -z "${GITOPS_IMAGE_REPO_YQ_PATH}" ]] && HELM_IMG_MISSING+=("gitops_image_repo_yq_path")
          [[ -z "${GITOPS_IMAGE_TAG_YQ_PATH}" ]] && HELM_IMG_MISSING+=("gitops_image_tag_yq_path")
          if [[ ${#HELM_IMG_MISSING[@]} -gt 0 ]]; then
            echo "❌ [HARD FAILURE] When gitops_image_values_file is used with gitops_chart_values_file, the following are mandatory: ${HELM_IMG_MISSING[*]}"
            exit 1
          fi
        fi
      fi

      # 2. Manifest-based validation
      if [[ -n "${GITOPS_MANIFEST_FILE}" ]]; then
        if [[ -z "${GITOPS_NEW_IMAGE}" ]]; then
          echo "❌ [HARD FAILURE] gitops_new_image is mandatory when gitops_manifest_file is specified."
          exit 1
        fi
      fi
    - GITOPS_AUTH_TOKEN="${GITOPS_INPUT_REPO_TOKEN:-${GITOPS_REPO_TOKEN:-}}"
    - |
      if [[ -n "${GITOPS_AUTH_TOKEN}" ]]; then
        GITOPS_AUTH_USER="${GITOPS_INPUT_REPO_USERNAME:-${GITOPS_REPO_USERNAME:-oauth2}}"
        echo "GitOps repository credentials: custom token for user '${GITOPS_AUTH_USER}'."
      else
        GITOPS_AUTH_USER="gitlab-ci-token"
        GITOPS_AUTH_TOKEN="${CI_JOB_TOKEN}"
        echo "GitOps repository credentials: CI_JOB_TOKEN."
      fi
    - GITOPS_AUTH_USER_ENC=$(printf '%s' "${GITOPS_AUTH_USER}" | jq -sRr @uri)
    - GITOPS_AUTH_TOKEN_ENC=$(printf '%s' "${GITOPS_AUTH_TOKEN}" | jq -sRr @uri)
    - GITOPS_REPO_AUTH_URL="${GITOPS_REPO_URL/https:\/\//https://${GITOPS_AUTH_USER_ENC}:${GITOPS_AUTH_TOKEN_ENC}@}"
    - git clone --depth 1 --branch "${GITOPS_BRANCH}" "${GITOPS_REPO_AUTH_URL}" "${GITOPS_TARGET_DIR}"
    - git -C "${GITOPS_TARGET_DIR}" config user.name "${GITOPS_GIT_USERNAME}"
    - git -C "${GITOPS_TARGET_DIR}" config user.email "${GITOPS_GIT_EMAIL}"
    - git -C "${GITOPS_TARGET_DIR}" remote set-url origin "${GITOPS_REPO_AUTH_URL}"
    - |
      if [[ -n "${GITOPS_MANIFEST_FILE}" ]]; then
        NEW_IMAGE_VALUE="${GITOPS_NEW_IMAGE}"
        if [[ -z "${NEW_IMAGE_VALUE}" ]]; then
          NEW_IMAGE_VALUE="${IMAGE_REGISTRY}/${IMAGE_PUSH_REPOSITORY:-${IMAGE_REPOSITORY}}:${TARGET_VERSION}"
        fi
        GITOPS_COMMIT_MESSAGE="chore(deploy): update ${GITOPS_MANIFEST_FILE} image to ${NEW_IMAGE_VALUE} [skip ci]"
        MANIFEST_PATH="${GITOPS_TARGET_DIR}/${GITOPS_MANIFEST_FILE}"
        if [[ ! -f "${MANIFEST_PATH}" ]]; then
          echo "❌ ERROR: Manifest file not found: ${MANIFEST_PATH}"
          exit 1
        fi
        echo "Updating manifest: ${MANIFEST_PATH} image -> ${NEW_IMAGE_VALUE}"
        yq eval '(.spec.template.spec.containers[0].image // .spec.containers[0].image) = "'"${NEW_IMAGE_VALUE}"'"' -i "${MANIFEST_PATH}"

      elif [[ -n "${GITOPS_CHART_APP_YQ_PATH}" ]]; then
        GITOPS_COMMIT_MESSAGE="chore(deploy): update ${GITOPS_CHART_APP_YQ_PATH} version=${TARGET_VERSION} [skip ci]"
        CHART_VALUES_PATH="${GITOPS_TARGET_DIR}/${GITOPS_CHART_VALUES_FILE}"
        if [[ ! -f "${CHART_VALUES_PATH}" ]]; then
          echo "❌ ERROR: chart values file not found: ${CHART_VALUES_PATH}"
          exit 1
        fi
        argocd_chart_repository
        if [[ -n "${CHART_REGISTRY}" ]]; then
          CHART_REPO_URL="${CHART_REGISTRY}/${ARGOCD_CHART_OCI_REPOSITORY}"
        elif [[ -n "${CI_API_V4_URL}" && -n "${CI_PROJECT_ID}" ]]; then
          CHART_REPO_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/${ARGOCD_CHART_CHANNEL}"
        else
          CHART_REPO_URL="${CHART_PUSH_REPOSITORY:-${CHART_REPOSITORY}}"
        fi
        echo "Setting ${GITOPS_CHART_APP_YQ_PATH}.chart.repoURL = ${CHART_REPO_URL}"
        echo "Setting ${GITOPS_CHART_APP_YQ_PATH}.chart.version = ${TARGET_VERSION}"
        yq eval "${GITOPS_CHART_APP_YQ_PATH}.chart.repoURL = \"${CHART_REPO_URL}\"" -i "${CHART_VALUES_PATH}"
        yq eval "${GITOPS_CHART_APP_YQ_PATH}.chart.version = \"${TARGET_VERSION}\"" -i "${CHART_VALUES_PATH}"
        if [[ -n "${GITOPS_IMAGE_VALUES_FILE}" ]]; then
          IMAGE_VALUES_PATH="${GITOPS_TARGET_DIR}/${GITOPS_IMAGE_VALUES_FILE}"
          if [[ ! -f "${IMAGE_VALUES_PATH}" ]]; then
            echo "❌ ERROR: GITOPS_IMAGE_VALUES_FILE not found: ${IMAGE_VALUES_PATH}"
            exit 1
          fi
          if [[ -n "${GITOPS_IMAGE_REPO_YQ_PATH}" ]]; then
            IMAGE_FULL_REPO="${IMAGE_REGISTRY}/${IMAGE_PUSH_REPOSITORY:-${IMAGE_REPOSITORY}}"
            echo "Setting ${GITOPS_IMAGE_REPO_YQ_PATH} = ${IMAGE_FULL_REPO}"
            yq eval "${GITOPS_IMAGE_REPO_YQ_PATH} = \"${IMAGE_FULL_REPO}\"" -i "${IMAGE_VALUES_PATH}"
          fi
          if [[ -n "${GITOPS_IMAGE_TAG_YQ_PATH}" ]]; then
            echo "Setting ${GITOPS_IMAGE_TAG_YQ_PATH} = ${TARGET_VERSION}"
            yq eval "${GITOPS_IMAGE_TAG_YQ_PATH} = \"${TARGET_VERSION}\"" -i "${IMAGE_VALUES_PATH}"
          fi
        fi
      else
        echo "❌ ERROR: Either GITOPS_CHART_APP_YQ_PATH (for Helm) or GITOPS_MANIFEST_FILE (for Manifest) must be provided."
        exit 1
      fi
    - |
      if [[ -z "$(git -C "${GITOPS_TARGET_DIR}" status --porcelain)" ]]; then
        echo "No changes detected in GitOps repository files."
      else
        git -C "${GITOPS_TARGET_DIR}" add .
        git -C "${GITOPS_TARGET_DIR}" commit -m "${GITOPS_COMMIT_MESSAGE}"
        git -C "${GITOPS_TARGET_DIR}" push origin "${GITOPS_BRANCH}"
        echo "Pushed to ${GITOPS_BRANCH}"
      fi
    - |
      ARGOCD_FAILED=()
      for APP in ${ARGOCD_APPS}; do
        echo "--- 🔄 Hard refresh: ${APP}"
        if ! argocd app get "${APP}" --hard-refresh --auth-token "${ARGOCD_TOKEN}" --server "${ARGOCD_SERVER}" --grpc-web; then
          echo "⚠️ Warning: Could not perform hard-refresh on ${APP}, proceeding to sync."
        fi
        echo "--- 🚀 Syncing: ${APP}"
        if ! argocd app sync "${APP}" --auth-token "${ARGOCD_TOKEN}" --server "${ARGOCD_SERVER}" --grpc-web --async; then
          echo "⚠️ Warning: Async sync initiation reported a warning on ${APP}, waiting for health status."
        fi
        echo "--- ⏳ Waiting for sync & health: ${APP} (timeout: ${ARGOCD_SYNC_TIMEOUT}s)"
        if ! argocd app wait "${APP}" --health --sync --operation --timeout "${ARGOCD_SYNC_TIMEOUT}" --auth-token "${ARGOCD_TOKEN}" --server "${ARGOCD_SERVER}" --grpc-web; then
          echo "❌ ERROR: App ${APP} failed to sync/become healthy within ${ARGOCD_SYNC_TIMEOUT}s"
          echo "View: ${ARGOCD_SERVER}/applications/${APP}"
          ARGOCD_FAILED+=("${APP}")
        else
          echo "✅ App ${APP} is synced and healthy"
        fi
      done
    - |
      if [[ ${#ARGOCD_FAILED[@]} -gt 0 ]]; then
        echo "❌ ERROR: The following apps failed: ${ARGOCD_FAILED[*]}"
        exit 1
      fi
