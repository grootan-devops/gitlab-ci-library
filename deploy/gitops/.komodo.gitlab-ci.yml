spec:
  inputs:
    environment:
      type: string
      description: "Target environment name (e.g. dev, staging, production)"
    gitops_repo_url:
      type: string
      description: "GitOps repository clone URL"
    gitops_branch:
      type: string
      description: "GitOps branch to update"
    gitops_compose_file:
      type: string
      default: "docker-compose.yml"
      description: "docker-compose.yml file path in GitOps repository"
    gitops_service_image_yq_path:
      type: string
      description: "yq path to the service image in docker-compose.yml"
    komodo_server:
      type: string
      default: ""
      description: "Komodo server URL (e.g. https://komodo.example.com). If empty, defaults to KOMODO_SERVER CI/CD variable"
    komodo_api_key:
      type: string
      default: ""
      description: "Komodo API Key (defaults to KOMODO_API_KEY CI/CD variable)"
    komodo_api_secret:
      type: string
      default: ""
      description: "Komodo API Secret (defaults to KOMODO_API_SECRET CI/CD variable)"
    komodo_stack_name:
      type: string
      description: "Komodo stack name to redeploy"
    komodo_sync_timeout:
      type: number
      default: 600
      description: "Timeout in seconds to wait for Komodo redeployment"
    environment_url:
      type: string
      default: ""
      description: "Optional URL for the deployed environment (e.g. https://myapp.example.com)"
    environment_action:
      type: string
      default: "start"
      description: "GitLab environment action (start, prepare, stop, verify, access)"
---

Deploy:Komodo:Validate:Image:$[[ inputs.environment ]]:
  stage: check
  extends:
    - .image-common
    - .image-registry-login
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW == "deploy" && ($DEPLOY_TARGET == "komodo-$[[ inputs.environment ]]" || $DEPLOY_TARGET == "$[[ inputs.environment ]]-komodo" || $DEPLOY_TARGET == "$[[ inputs.environment ]]")'
    - when: never
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
  script:
    - |
      if [[ "${TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        IMAGE_TARGET_REPO="${IMAGE_REPOSITORY}"
      else
        IMAGE_TARGET_REPO="${IMAGE_REPOSITORY}${IMAGE_DEV_REPOSITORY_SUFFIX}"
      fi
    - TARGET_IMG="${IMAGE_REGISTRY}/${IMAGE_TARGET_REPO}:${TARGET_VERSION}"
    - |
      if docker manifest inspect "${TARGET_IMG}" > /dev/null 2>&1; then
        echo "✅ Container image '${TARGET_IMG}' verified in registry."
      else
        echo "❌ ERROR: Container image '${TARGET_IMG}' does not exist in registry."
        exit 1
      fi

Deploy:Komodo:$[[ inputs.environment ]]:
  stage: deploy
  interruptible: false
  environment:
    name: $[[ inputs.environment ]]
    url: $[[ inputs.environment_url ]]
    action: $[[ inputs.environment_action ]]
  variables:
    GITOPS_REPO_URL: "$[[ inputs.gitops_repo_url ]]"
    GITOPS_BRANCH: "$[[ inputs.gitops_branch ]]"
    GITOPS_TARGET_DIR: _gitops_repo
    GITOPS_COMPOSE_FILE: "$[[ inputs.gitops_compose_file ]]"
    GITOPS_SERVICE_IMAGE_YQ_PATH: "$[[ inputs.gitops_service_image_yq_path ]]"
    KOMODO_INPUT_SERVER: "$[[ inputs.komodo_server ]]"
    KOMODO_INPUT_API_KEY: "$[[ inputs.komodo_api_key ]]"
    KOMODO_INPUT_API_SECRET: "$[[ inputs.komodo_api_secret ]]"
    KOMODO_STACK_NAME: "$[[ inputs.komodo_stack_name ]]"
    KOMODO_SYNC_TIMEOUT: $[[ inputs.komodo_sync_timeout ]]
    KOMODO_POLL_INTERVAL: 10
    GITOPS_GIT_USERNAME: gitlab-ci
    GITOPS_GIT_EMAIL: gitlab-ci@gitlab.com
  rules:
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW == "deploy" && ($DEPLOY_TARGET == "komodo-$[[ inputs.environment ]]" || $DEPLOY_TARGET == "$[[ inputs.environment ]]-komodo" || $DEPLOY_TARGET == "$[[ inputs.environment ]]")'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW == "full-pipeline"'
      when: manual
      allow_failure: true
    - when: never
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Image:Push
      artifacts: false
      optional: true
    - job: Deploy:Komodo:Validate:Image:$[[ inputs.environment ]]
      artifacts: false
      optional: true
  script:
    - TARGET_VERSION="${TARGET_VERSION:-${APP_PUSH_VERSION:-${TAG}}}"
    - KOMODO_SERVER="${KOMODO_INPUT_SERVER:-${KOMODO_SERVER}}"
    - KOMODO_API_KEY="${KOMODO_INPUT_API_KEY:-${KOMODO_API_KEY}}"
    - KOMODO_API_SECRET="${KOMODO_INPUT_API_SECRET:-${KOMODO_API_SECRET}}"
    - MISSING=()
    - |
      [[ -z "${TARGET_VERSION}" ]] && MISSING+=("TARGET_VERSION (or APP_PUSH_VERSION / TAG)")
      [[ -z "${GITOPS_REPO_URL}" ]] && MISSING+=("gitops_repo_url")
      [[ -z "${GITOPS_BRANCH}" ]] && MISSING+=("gitops_branch")
      [[ -z "${GITOPS_COMPOSE_FILE}" ]] && MISSING+=("gitops_compose_file")
      [[ -z "${GITOPS_SERVICE_IMAGE_YQ_PATH}" ]] && MISSING+=("gitops_service_image_yq_path")
      [[ -z "${KOMODO_SERVER}" ]] && MISSING+=("komodo_server (or KOMODO_SERVER)")
      [[ -z "${KOMODO_API_KEY}" ]] && MISSING+=("komodo_api_key (or KOMODO_API_KEY)")
      [[ -z "${KOMODO_API_SECRET}" ]] && MISSING+=("komodo_api_secret (or KOMODO_API_SECRET)")
      [[ -z "${KOMODO_STACK_NAME}" ]] && MISSING+=("komodo_stack_name")
      if [[ ${#MISSING[@]} -gt 0 ]]; then
        echo "❌ [HARD FAILURE] Missing mandatory deployment configuration: ${MISSING[*]}"
        exit 1
      fi
    - GITOPS_REPO_AUTH_URL="${GITOPS_REPO_URL/https:\/\//https://gitlab-ci-token:${CI_JOB_TOKEN}@}"
    - git clone --depth 1 --branch "${GITOPS_BRANCH}" "${GITOPS_REPO_AUTH_URL}" "${GITOPS_TARGET_DIR}"
    - git -C "${GITOPS_TARGET_DIR}" config user.name "${GITOPS_GIT_USERNAME}"
    - git -C "${GITOPS_TARGET_DIR}" config user.email "${GITOPS_GIT_EMAIL}"
    - git -C "${GITOPS_TARGET_DIR}" remote set-url origin "${GITOPS_REPO_AUTH_URL}"
    - COMPOSE_PATH="${GITOPS_TARGET_DIR}/${GITOPS_COMPOSE_FILE}"
    - |
      if [[ ! -f "${COMPOSE_PATH}" ]]; then
        echo "❌ ERROR: Compose file not found: ${COMPOSE_PATH}"
        exit 1
      fi
    - CURRENT_IMAGE=$(yq eval "${GITOPS_SERVICE_IMAGE_YQ_PATH}" "${COMPOSE_PATH}")
    - |
      if [[ -z "${CURRENT_IMAGE}" || "${CURRENT_IMAGE}" == "null" ]]; then
        echo "❌ ERROR: Path '${GITOPS_SERVICE_IMAGE_YQ_PATH}' not found in ${COMPOSE_PATH}"
        exit 1
      fi
    - NEW_IMAGE="${IMAGE_REGISTRY}/${IMAGE_PUSH_REPOSITORY:-${IMAGE_REPOSITORY}}:${TARGET_VERSION}"
    - >
      echo "Updating ${GITOPS_COMPOSE_FILE}: ${CURRENT_IMAGE} -> ${NEW_IMAGE}"
    - yq eval "${GITOPS_SERVICE_IMAGE_YQ_PATH} = \"${NEW_IMAGE}\"" -i "${COMPOSE_PATH}"
    - |
      if git -C "${GITOPS_TARGET_DIR}" diff --quiet; then
        echo "No changes detected in ${GITOPS_COMPOSE_FILE}. Image is already ${NEW_IMAGE}."
      else
        git -C "${GITOPS_TARGET_DIR}" add "${GITOPS_COMPOSE_FILE}"
        git -C "${GITOPS_TARGET_DIR}" commit -m "chore(deploy): update ${KOMODO_STACK_NAME} image to ${NEW_IMAGE} [skip ci]"
        git -C "${GITOPS_TARGET_DIR}" push origin "${GITOPS_BRANCH}"
        echo "Pushed GitOps commit to ${GITOPS_BRANCH}"
      fi
    - echo "Triggering redeploy for Komodo stack '${KOMODO_STACK_NAME}'..."
    - |
      # --fail-with-body is load-bearing: without it a 401/500 returns an HTML error
      # body, jq extracts no execution_id, and the job falls through to the "request
      # accepted" branch below and exits 0 — reporting a deployment that never happened.
      RESPONSE=$(curl --fail-with-body --silent --show-error --location \
        --request POST "${KOMODO_SERVER}/api/v1/update-stack" \
        --header "Content-Type: application/json" \
        --header "x-api-key: ${KOMODO_API_KEY}" \
        --header "x-api-secret: ${KOMODO_API_SECRET}" \
        --data "{\"name\": \"${KOMODO_STACK_NAME}\"}") || {
          echo "❌ ERROR: Komodo update-stack request failed: ${RESPONSE}"
          exit 1
        }
    - >
      echo "Komodo update-stack response: ${RESPONSE}"
    - EXEC_ID=$(echo "${RESPONSE}" | jq -r '.execution_id // .id // .data.execution_id // empty')
    - |
      if [[ -n "${EXEC_ID}" ]]; then
        echo "Tracking Komodo execution: ${EXEC_ID} (timeout: ${KOMODO_SYNC_TIMEOUT}s)..."
        START_TIME=$(date +%s)
        while true; do
          STATUS_RESP=$(curl --fail-with-body --silent --show-error --location \
            --request GET "${KOMODO_SERVER}/api/v1/execution/${EXEC_ID}" \
            --header "x-api-key: ${KOMODO_API_KEY}" \
            --header "x-api-secret: ${KOMODO_API_SECRET}") || {
              echo "❌ ERROR: Failed to poll Komodo execution ${EXEC_ID}: ${STATUS_RESP}"
              exit 1
            }
          STATUS=$(echo "${STATUS_RESP}" | jq -r '.status // .data.status // empty')
          echo "Current deployment status: ${STATUS}"
          case "${STATUS}" in
            "SUCCESS"|"success"|"Completed"|"completed")
              echo "✅ Komodo stack '${KOMODO_STACK_NAME}' deployed successfully."
              break
              ;;
            "FAILED"|"failed"|"Error"|"error")
              echo "❌ ERROR: Komodo deployment failed. Response: ${STATUS_RESP}"
              exit 1
              ;;
            *)
              CURRENT_TIME=$(date +%s)
              ELAPSED=$((CURRENT_TIME - START_TIME))
              if [[ ${ELAPSED} -ge ${KOMODO_SYNC_TIMEOUT} ]]; then
                echo "❌ ERROR: Deployment timed out after ${KOMODO_SYNC_TIMEOUT}s."
                exit 1
              fi
              echo "Waiting ${KOMODO_POLL_INTERVAL}s... (${ELAPSED}s elapsed)"
              sleep ${KOMODO_POLL_INTERVAL}
              ;;
          esac
        done
      else
        echo "⚠️ No execution ID returned. Stack update request was accepted."
      fi
