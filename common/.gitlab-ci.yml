  TF_README_FILE_NAME: README.md
  TF_TEST_TIMEOUT: 1h
  TF_LOG_FILE_NAME: tf_test.log
  TF_CVE_INFO_FILE_NAME: TF_CVE.md
  TF_README_MD_FILE_NAME: TF_README.md

.retry-with-script-failure:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - runner_unsupported
      - job_execution_timeout
      - unknown_failure
      - stale_schedule
      - script_failure

.release-rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $MASTER_BRANCH_REGEX && $CI_COMMIT_REF_PROTECTED == "true"

.master-fast-track-rules:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/'
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $MASTER_BRANCH_REGEX && $CI_COMMIT_REF_PROTECTED == "true"

.mr-only-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - when: never

.lifecycle-rules:
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ $MASTER_BRANCH_REGEX && $CI_COMMIT_REF_PROTECTED == "true"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "build" || $WORKFLOW == "check" || $WORKFLOW == "image-build-and-push" || $WORKFLOW == "chart-build-and-push")'
