stages:
  - .pre
  - init
  - prepare
  - lint
  - check
  - test
  - build
  - push
  - security
  - qa
  - report
  - deploy
  - release
  - notify
  - trigger
  - destroy
  - .post

variables:
  # Workflow Selector for Web / API manual dispatch
  WORKFLOW:
    value: "full-pipeline"
    options:
      - "full-pipeline"
      - "build"
      - "check"
      - "deploy"
      - "sonarqube"
      - "secret-scanning"
      - "license-scanning"
      - "sbom-scanning"
      - "lint"
      - "image-build-and-push"
      - "image-scan"
      - "chart-build-and-push"
      - "chart-scan"
    description: "Select the workflow to execute. (Active during manual Web / API runs)"

  # Target Semantic Version / Image Tag / Artifact Version Override
  TARGET_VERSION:
    value: ""
    description: "Target version or tag (e.g. 1.8.0, latest). Used as: deployment version override in 'deploy', image tag in 'image-scan', or manual release version override."

  GIT_DEPTH: 1

  PROJECT_PATH: "."
  PROJECT_CACHE_KEY: ""
  MASTER_BRANCH_REGEX: /^.*\/master$/

  SKIP_CVE_SCAN: "false"

  CHANGELOG_FILE_NAME: ./CHANGELOG.md
  RELEASE_CHANGELOG_FILE_NAME: RELEASE_CHANGELOG.md
  RELEASE_CHANGELOG_CARD_FILE_NAME: RELEASE_CHANGELOG_CARD.json

  MIGRATION_FILE_NAME: ./MIGRATION.md
  RELEASE_MIGRATION_FILE_NAME: RELEASE_MIGRATION.md

  ## ---------------------------------------------------------------------------
  ## External Service Configuration (Configure in GitLab CI/CD Variables or Project or global)
  ## ---------------------------------------------------------------------------
  # --- Container & Helm Registry ---
  # IMAGE_REGISTRY: ""
  # IMAGE_REGISTRY_USERNAME: ""
  # IMAGE_REGISTRY_PASSWORD: ""
  # CHART_REGISTRY: ""
  # CHART_REGISTRY_USERNAME: ""
  # CHART_REGISTRY_PASSWORD: ""
  # IMAGE_REPOSITORY: ""
  # CHART_REPOSITORY: ""
  # RELEASE_VERSION_SUFFIX: ""
  # RELEASE_VERSION: ""
  # HELM_TEST_VALUES: ""
  # ADDITIONAL_RELEASE_ARTIFACT: ""
  #
  # --- GitOps Deployment: ArgoCD ---
  # ARGOCD_SERVER: "https://argocd.example.com"
  # ARGOCD_TOKEN: ""
  # GITOPS_REPO_URL: "https://gitlab.example.com/devops/gitops/app-gitops.git"
  # GITOPS_BRANCH: "main"
  #
  # --- GitOps Deployment: Komodo ---
  # KOMODO_SERVER: "https://komodo.example.com"
  # KOMODO_API_KEY: ""
  # KOMODO_API_SECRET: ""
  #
  # --- Code Quality: SonarQube ---
  # SONAR_URL: "http://sonarqube-sonarqube.sonarqube:9000"
  # SONAR_EXTERNAL_URL: "https://sonarqube.example.com"
  # SONARQUBE_TOKEN: ""

  # --- Security: Trivy Remote Scanner ---
  # TRIVY_HOST: "http://trivy.trivy:4954"
  #
  # --- Notifications: Microsoft Teams Adaptive Cards ---
  # RELEASE_MESSAGE_TEAMS_WORKFLOWS_URL: ""

  MICRO_ROOT_BASE_IMAGE_REPO: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/registry-1.docker.io/grootantech/micro-root
  MICRO_ROOT_BASE_IMAGE_TAG: 1.0.0
  NGINX_MICRO_BASE_IMAGE_REPO: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/registry-1.docker.io/grootantech/micro-nginx
  NGINX_MICRO_BASE_IMAGE_TAG: 1.0.0
  PYTHON_312_MICRO_BASE_IMAGE_REPO: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/registry-1.docker.io/grootantech/micro-python-3-12
  PYTHON_312_MICRO_BASE_IMAGE_TAG: 1.0.0
  JAVA_25_MICRO_BASE_IMAGE_REPO: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/registry-1.docker.io/grootantech/micro-java-25
  JAVA_25_MICRO_BASE_IMAGE_TAG: 1.0.0
  NODE_JS_24_MICRO_BASE_IMAGE_REPO: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/registry-1.docker.io/grootantech/micro-node-24
  NODE_JS_24_MICRO_BASE_IMAGE_TAG: 1.0.0

  DOCKER_DIND_IMAGE_REPO: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker
  DOCKER_DIND_IMAGE_TAG: "29.3.1-dind"
  BUILDKIT_IMAGE_REPO: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/moby/buildkit
  BUILDKIT_IMAGE_TAG: v0.29.0

  TOOLKIT_IMAGE_REPO: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/registry-1.docker.io/grootantech/toolkit
  TOOLKIT_IMAGE_TAG: 1.0.0
