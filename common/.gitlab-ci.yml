  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_NAME: dockerimage:internal
  DOCKERFILE: Dockerfile
  USE_DOCKER_BUILDX: "true"
  IMAGE_TAR_FILE_NAME: image.tar.gz
  IMAGE_REPOSITORY: ""
  IMAGE_DEV_REPOSITORY_SUFFIX: /dev
  HADOLINT_IGNORE: ""
  IMAGE_TEST_SCRIPT_FILE_NAME: ci_image_test.sh
  IMAGE_INFO_FILE_NAME: IMAGE_INFO.md
  IMAGE_CVE_INFO_FILE_NAME: IMAGE_CVE.md
  IMAGE_CVE_REPORT_FILE_NAME: image_${TRIVY_SCAN_REPORT_NAME_SUFFIX}.md
  IMAGE_README_MD_FILE_NAME: IMAGE_README.md

