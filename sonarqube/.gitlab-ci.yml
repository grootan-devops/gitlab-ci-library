Sonarqube:
  stage: qa
  when: always
  extends:
    - .sonarqube-workflow-rules
  image: ${SONAR_SCANNER_CLI_IMAGE_REPO}:${SONAR_SCANNER_CLI_IMAGE_TAG}
  variables:
    SONAR_USER_HOME: ${CI_PROJECT_DIR}/.sonar
    SONAR_SCANNER_OPTS: "-XX:MaxRAMPercentage=90.0 -XX:InitialRAMPercentage=90.0"
    GIT_DEPTH: 0
  cache:
    key: sonar-${PROJECT_CACHE_KEY}
    when: always
    policy: pull-push
    paths:
      - ${CI_PROJECT_DIR}/.sonar
  script:
    - |
      if [[ ${PROJECT_PATH} != "." ]]; then
        CI_PROJECT_PATH_SLUG="${CI_PROJECT_PATH_SLUG}_$(echo "${PROJECT_PATH}" | tr -c "a-zA-Z0-9_.:-" "-" | sed "s/-\+/-/g;s/^-//;s/-$//")"
      fi
    - sonar-scanner -Dproject.settings=sonar.properties -Dsonar.qualitygate.wait="true" -Dsonar.projectVersion="${TAG}" -Dsonar.token="${SONARQUBE_TOKEN}" -Dsonar.host.url="${SONAR_URL}" -Dsonar.projectKey="${CI_PROJECT_PATH_SLUG}" -Dsonar.links.ci="${CI_PROJECT_URL}/-/pipelines" -Dsonar.links.scm="${CI_PROJECT_URL}"
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Project:Build
      artifacts: true
      optional: true
    - job: Project:Unit:Test
      artifacts: true
      optional: true
