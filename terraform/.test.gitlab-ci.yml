variables:
  TF_TEST_TIMEOUT: 1h
  TF_LOG_FILE_NAME: tf_test.log

Terraform:Module:Test:
  stage: qa
  interruptible: false
  image: ${GO_BUILD_IMAGE_REPO}:${GO_BUILD_IMAGE_TAG}
  extends:
    - .terraform-common
    - .terraform-module-test-rules
  script:
    - cd tests
    - go test -v -timeout ${TF_TEST_TIMEOUT} 2>&1 | tee ${TF_LOG_FILE_NAME}
  artifacts:
    name: TF Test Artifacts
    expose_as: TF Test Artifacts
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/tests/${TF_LOG_FILE_NAME}
      - ${PROJECT_PATH}/test_output.tf
      - ${PROJECT_PATH}/terraform.tfstate
      - ${PROJECT_PATH}/terraform.tfstate.backup
    reports:
      dotenv: ${PROJECT_PATH}/tests/tf.env
  needs:
    - job: Terraform:Validate
      artifacts: false
      optional: false

Terraform:Module:Test:Destroy:
  stage: destroy
  interruptible: false
  image: ${GO_BUILD_IMAGE_REPO}:${GO_BUILD_IMAGE_TAG}
  extends:
    - .terraform-common
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
      exists:
        - ${PROJECT_PATH}/main.tf
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
      exists:
        - ${PROJECT_PATH}/main.tf
      when: on_failure
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW == "full-pipeline"'
      exists:
        - ${PROJECT_PATH}/main.tf
      when: on_failure
    - when: never
  script:
    - terraform init
    - terraform destroy
  needs:
    - job: Terraform:Module:Test
      artifacts: true
      optional: false
