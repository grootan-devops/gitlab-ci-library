.chart-common:
  variables:
    TRIVY_SCAN_REPORT_NAME_PREFIX: "chart"
    TRIVY_SCAN_REPORT_NAME: "${TRIVY_SCAN_REPORT_NAME_PREFIX}_${TRIVY_SCAN_REPORT_NAME_SUFFIX}"
    IAC_SCAN_PATH: "${CHART_DIR}"
    IGNORED_CVES_YQ_PATH: "iac.chart"
    SCAN_TYPE: config
    CONFIG_TYPE: ${TRIVY_SCAN_REPORT_NAME_PREFIX}

.chart-registry:
  script: &chart-registry |
    # The chart helpers. They need the registry functions loaded first
    # (`- !reference [.registry-functions, script]`). Every repository is a full OCI
    # repository, host/path, and the chart lives at <repository>/<chart name>.
    #
    # PROD_CHART_REPO and DEV_CHART_REPO of the primary destination, with one auth file for
    # every registry the job reads or writes, chart dependencies included.
    chart_registry_setup() {
      registry_auth || return 1
      registry_select chart "" || return 1
      PROD_CHART_REPO="${SELECTED_HOST}/${SELECTED_STABLE}"
      DEV_CHART_REPO="${SELECTED_HOST}/${SELECTED_DEV}"
    }

    chart_dependency_login() {
      registry_auth
    }

    # Return 0 for present, 1 for confirmed absence, 2 for an operational error.
    chart_exists() {
      local VERSION="$1" REPOSITORY="$2" OUTPUT
      if OUTPUT=$(helm show chart "oci://${REPOSITORY}/${RESOLVED_CHART_NAME}" --version "${VERSION}" 2>&1); then
        return 0
      fi
      case "${OUTPUT}" in
        *401*|*403*|*Unauthorized*|*unauthorized*|*denied*|*timeout*|*connection*|*"no such host"*|*x509*|*executable*|*"command not found"*) ;;
        *"not found"*|*"404 Not Found"*|*MANIFEST_UNKNOWN*|*NAME_UNKNOWN*) return 1 ;;
      esac
      echo "ERROR: OCI chart lookup in ${REPOSITORY} failed; availability cannot be confirmed." >&2
      return 2
    }

    chart_pull() {
      local VERSION="$1" REPOSITORY="$2" DESTINATION="$3"
      if ! helm pull "oci://${REPOSITORY}/${RESOLVED_CHART_NAME}" --version "${VERSION}" --untar --untardir "${DESTINATION}" >/dev/null 2>&1; then
        echo "ERROR: Cannot pull chart ${RESOLVED_CHART_NAME}:${VERSION} from ${REPOSITORY}." >&2
        return 1
      fi
    }

    chart_publish() {
      local PACKAGE="$1" REPOSITORY="$2"
      if ! helm push "${PACKAGE}" "oci://${REPOSITORY}" >/dev/null 2>&1; then
        echo "ERROR: Chart push to oci://${REPOSITORY} failed." >&2
        return 1
      fi
    }

.chart-login:
  script: &chart-login
    - !reference [.registry-functions, script]
    - *chart-registry
    - chart_dependency_login

.chart-dependency-update:
  script: &chart-dependency-update
    - helm dependency update "${CHART_DIR}/"

.chart-lint-workflow-rules:
  rules:
    - !reference [.verify-rules, rules]
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW =~ /^(full-pipeline|lint|chart-build-and-push)$/'
    - when: never

.chart-check-rules:
  rules:
    - !reference [.verify-rules, rules]
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW =~ /^(full-pipeline|check|chart-build-and-push|chart-scan)$/'
    - when: never

.chart-docs-dependency-check-rules:
  rules:
    - !reference [.verify-rules, rules]
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && $WORKFLOW =~ /^(full-pipeline|check|chart-build-and-push)$/'
    - when: never

Chart:Check Existence:
  extends:
    - .chart-common
    - .check-job-common
    - .chart-check-rules
  script:
    - !reference [.registry-functions, script]
    - *chart-registry
    - |
      RESOLVED_CHART_NAME="${CHART_NAME:-}"
      if [[ -z "${RESOLVED_CHART_NAME}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        RESOLVED_CHART_NAME=$(yq '.name // ""' "${CHART_DIR}/${CHART_FILE}")
      fi
      if [[ "${WORKFLOW:-}" == "chart-scan" && -z "${TARGET_VERSION:-}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        echo "Local chart found; no remote lookup needed."
        exit 0
      fi
      : "${RESOLVED_CHART_NAME:?Chart name is required}"
      chart_registry_setup
    - |
      # chart-scan reads one chart, from the selected destination; every other workflow
      # checks that the release version is free in every destination.
      if [[ "${WORKFLOW:-}" == "chart-scan" ]]; then
        CHECK_VERSION="${TARGET_VERSION:?TARGET_VERSION is required for a remote scan}"
        registry_select chart "${DEPLOY_CHART_REPOSITORY:-}"
        CHECK_REPO=$(registry_version_repository "${CHECK_VERSION}")
        if chart_exists "${CHECK_VERSION}" "${CHECK_REPO}"; then
          echo "Remote chart ${CHECK_REPO}/${RESOLVED_CHART_NAME}:${CHECK_VERSION} exists."
        else
          RESULT=$?
          [[ "${RESULT}" -eq 1 ]] || exit "${RESULT}"
          echo "ERROR: Remote chart ${CHECK_REPO}/${RESOLVED_CHART_NAME}:${CHECK_VERSION} does not exist."
          exit 1
        fi
      else
        CHECK_VERSION="${CHART_RELEASE_VERSION:?Chart version is required}"
        FOUND=()
        while IFS=$'\t' read -r HOST STABLE DEV; do
          if chart_exists "${CHECK_VERSION}" "${HOST}/${STABLE}"; then
            FOUND+=("${HOST}/${STABLE}")
          else
            RESULT=$?
            [[ "${RESULT}" -eq 1 ]] || exit "${RESULT}"
          fi
        done <<<"$(registry_targets chart)"
        if [[ "${#FOUND[@]}" -gt 0 ]]; then
          echo "ERROR: Chart ${RESOLVED_CHART_NAME}:${CHECK_VERSION} already exists in: ${FOUND[*]}. Bump the version."
          exit 1
        fi
        echo "Chart version is available."
      fi
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
    - job: Common:Init
      artifacts: true
      optional: true

Chart:Check:README:
  extends:
    - .chart-common
    - .check-job-common
    - .chart-docs-dependency-check-rules
  script:
    - cd ${CHART_DIR}
    - MD5_CHART_DOCS=$(md5sum README.md)
    - helm-docs --template-files "README.gotmpl" --sort-values-order file --document-dependency-values
    - MD5_NEW_CHART_DOCS=$(md5sum README.md)
    - |
      if [[ "${MD5_CHART_DOCS}" != "${MD5_NEW_CHART_DOCS}" ]]; then
        echo "MD5 checksums do not match for README.md file. perform \`helm-docs --template-files README.gotmpl --sort-values-order file --document-dependency-values\`"
        exit 1
      fi

Chart:Check:Dependency:
  extends:
    - .chart-common
    - .check-job-common
    - .check-workflow-rules
  script:
    - |
      if cat "${CHART_DIR}/${CHART_FILE}" | grep -q "helm/dev"; then
        echo "dev registry found in ${CHART_FILE}. Only stable releases should be used in chart dependency."
        exit 1
      fi

Chart:Values:Lint:
  stage: lint
  variables:
    LINT_YAML_FILES: "${CHART_DIR}/values.yaml"
  extends:
    - .YAML:Lint
    - .lint-workflow-rules

Chart:Lint:
  stage: lint
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
  extends:
    - .chart-common
    - .chart-lint-workflow-rules
  script:
    - *chart-login
    - *chart-dependency-update
    - |
      if [[ -z "${HELM_TEST_VALUES}" ]]; then
        helm lint --strict -f "${CHART_DIR}/values.yaml" "${CHART_DIR}/"
      else
        echo "${HELM_TEST_VALUES}" > "${IAC_SCAN_PATH}/override.yaml"
        helm lint --strict -f "${CHART_DIR}/values.yaml" -f "${IAC_SCAN_PATH}/override.yaml" "${CHART_DIR}/"
      fi
  dependencies: []

.Chart:UnitTest:
  stage: test
  extends:
    - .chart-lint-workflow-rules
  variables:
    MOCK_CHART: tests
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
  script:
    # Kept in script rather than before_script: the library default before_script does
    # `cd ${PROJECT_PATH}`, and declaring one here would silently replace it.
    - *chart-login
    - CHART_PATH="${CHART_DIR}/${MOCK_CHART}"
    - |
      if [[ ! -f "${CHART_PATH}/Chart.yaml" ]]; then
        echo "ERROR: Mock chart '${CHART_PATH}' lacks Chart.yaml." >&2
        exit 1
      fi
    - |
      if ! compgen -G "${CHART_PATH}/tests/*_test.yaml" >/dev/null; then
        echo "ERROR: No Helm unittest suites under ${CHART_PATH}/tests/." >&2
        exit 1
      fi
    - helm dependency update "${CHART_PATH}"
    - helm unittest --strict --output-type JUnit --output-file unittest-report.xml --file "${CHART_PATH}/tests/*_test.yaml" "${CHART_PATH}"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: unittest-report.xml
    paths:
      - unittest-report.xml
  dependencies: []

Chart:Build:
  stage: build
  extends:
    - .chart-common
    - .chart-build-workflow-rules
  script:
    - *chart-login
    - *chart-dependency-update
    - helm package "${CHART_DIR}/" --version "${CHART_PUSH_VERSION}" --app-version "${APP_PUSH_VERSION}"
  artifacts:
    name: Chart Package
    expose_as: Chart Package
    when: always
    expire_in: 1 week
    paths:
      - "${PROJECT_PATH}/${CHART_NAME}-${CHART_PUSH_VERSION}.tgz"
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Chart:Lint
      artifacts: false
      optional: true

Chart:Push:
  stage: push
  extends:
    - .chart-common
    - .chart-build-workflow-rules
  script:
    - !reference [.registry-functions, script]
    - *chart-registry
    - chart_registry_setup
    - |
      # A release (no RC suffix) goes to the stable repository and is mirrored to dev;
      # a candidate goes to dev only. Every other destination then gets the same.
      CHART_PACKAGE_FILE="${CHART_NAME}-${CHART_PUSH_VERSION}.tgz"
      [[ -f "${CHART_PACKAGE_FILE}" ]] || { echo "ERROR: Chart package ${CHART_PACKAGE_FILE} not found."; exit 1; }
      PUSH_WHICH=stable
      PUSH_REPO="${PROD_CHART_REPO}"
      if [[ -n "${RC_VERSION_SUFFIX:-}" ]]; then
        PUSH_WHICH=dev
        PUSH_REPO="${DEV_CHART_REPO}"
      fi
      chart_publish "${CHART_PACKAGE_FILE}" "${PUSH_REPO}"
      if [[ "${PUSH_WHICH}" == "stable" && "${PUSH_REPO}" != "${DEV_CHART_REPO}" ]]; then
        if ! chart_publish "${CHART_PACKAGE_FILE}" "${DEV_CHART_REPO}"; then
          echo "WARNING: Optional dev mirror failed; the primary chart publish succeeded."
        fi
      fi
      {
        echo "### Helm Chart Package Info"
        echo "- Name: ${CHART_NAME}"
        echo "- Version: ${CHART_PUSH_VERSION}"
        echo "- Repository: oci://${PUSH_REPO}"
      } > "${CHART_INFO_FILE_NAME}"
      cat "${CHART_INFO_FILE_NAME}"
    - registry_mirror chart "${PUSH_WHICH}" "${CHART_PUSH_VERSION}"
    - |
      if [[ "${PUSH_WHICH}" == "stable" && "${PROD_CHART_REPO}" != "${DEV_CHART_REPO}" ]]; then
        registry_mirror chart dev "${CHART_PUSH_VERSION}"
      fi
  artifacts:
    name: Chart Info
    expose_as: Chart Info
    when: always
    expire_in: 1 week
    paths:
      - "${PROJECT_PATH}/${CHART_INFO_FILE_NAME}"
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Chart:Build
      artifacts: true
      optional: false

Chart:Scan:
  extends:
    - .scan-script
    - .chart-common
    - .chart-scan-workflow-rules
  before_script:
    - cd "${PROJECT_PATH}"
    - !reference [.registry-functions, script]
    - *chart-registry
    - |
      RESOLVED_CHART_NAME="${CHART_NAME:-}"
      if [[ -z "${RESOLVED_CHART_NAME}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        RESOLVED_CHART_NAME=$(yq '.name // ""' "${CHART_DIR}/${CHART_FILE}")
      fi
      SCAN_CHART_PATH="${CHART_DIR}"
      if [[ -n "${TARGET_VERSION:-}" ]]; then
        : "${RESOLVED_CHART_NAME:?Chart name is required}"
        chart_registry_setup
        registry_select chart "${DEPLOY_CHART_REPOSITORY:-}"
        SCAN_REPO=$(registry_version_repository "${TARGET_VERSION}")
        SCAN_TEMP=$(mktemp -d)
        trap 'rm -rf "${SCAN_TEMP}"' EXIT
        chart_pull "${TARGET_VERSION}" "${SCAN_REPO}" "${SCAN_TEMP}"
        SCAN_CHART_PATH="${SCAN_TEMP}/${RESOLVED_CHART_NAME}"
        [[ -f "${SCAN_CHART_PATH}/${CHART_FILE}" ]] || { echo "ERROR: Pulled chart is missing its manifest."; exit 1; }
      fi
      chart_dependency_login
    - export IAC_SCAN_PATH="${SCAN_CHART_PATH}"
    - >
      echo "Scanning chart at: ${IAC_SCAN_PATH}"
    - helm dependency update "${SCAN_CHART_PATH}/"
    - |
      if [[ -z "${HELM_TEST_VALUES}" ]]; then
        helm template debug "${SCAN_CHART_PATH}" -f "${SCAN_CHART_PATH}/values.yaml" > /dev/null
      else
        export TRIVY_HELM_VALUES_FILE="${CI_PROJECT_DIR}/${PROJECT_PATH}/_scan_override.yaml"
        echo "${HELM_TEST_VALUES}" > "${TRIVY_HELM_VALUES_FILE}"
        helm template debug "${SCAN_CHART_PATH}" -f "${SCAN_CHART_PATH}/values.yaml" -f "${TRIVY_HELM_VALUES_FILE}" > /dev/null
      fi
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
    - job: Chart:Lint
      artifacts: false
      optional: true
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Trivy:Cache:Warm
      artifacts: false
      optional: true
  artifacts:
    name: Chart Scan Report
    expose_as: Chart Scan Report
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.md
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.json
      - ${PROJECT_PATH}/${CHART_CVE_INFO_FILE_NAME}
    reports:
      junit: ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit

Chart:Promote:
  stage: release
  extends:
    - .release-rules
    - .chart-common
  needs:
    - job: Common:Init
      artifacts: true
      optional: false
  script:
    - cd ${CI_PROJECT_DIR}
    - cd ${PROJECT_PATH}
    - !reference [.registry-functions, script]
    - *chart-registry
    - chart_registry_setup
    - |
      : "${CHART_NAME:?Chart name is required}"
      : "${TAG:?Release tag is required}"
      RESOLVED_CHART_NAME="${CHART_NAME}"
      PROMOTE_TEMP=$(mktemp -d)
      trap 'rm -rf "${PROMOTE_TEMP}"' EXIT
      PULLED=0
      CANDIDATES=("${DEV_CANDIDATE_CHART_VERSION:-}" "${DEV_CANDIDATE_VERSION:-}")
      [[ -z "${UPSTREAM_PIPELINE_ID:-}" ]] || CANDIDATES+=("${TAG}-rc.${UPSTREAM_PIPELINE_ID}")
      CANDIDATES+=("${TAG}")
      for CANDIDATE in "${CANDIDATES[@]}"; do
        [[ -n "${CANDIDATE}" ]] || continue
        if chart_exists "${CANDIDATE}" "${DEV_CHART_REPO}"; then
          chart_pull "${CANDIDATE}" "${DEV_CHART_REPO}" "${PROMOTE_TEMP}"
          PULLED=1
          break
        else
          RESULT=$?
          [[ "${RESULT}" -eq 1 ]] || exit "${RESULT}"
        fi
      done
      if [[ "${PULLED}" -eq 1 ]]; then
        helm package "${PROMOTE_TEMP}/${CHART_NAME}" --version "${TAG}" --app-version "${TAG}"
      elif [[ -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        echo "WARNING: No candidate found; packaging the working tree. These bytes were not scanned as a candidate."
        chart_dependency_login
        helm dependency update "${CHART_DIR}/"
        helm package "${CHART_DIR}" --version "${TAG}" --app-version "${TAG}"
      else
        echo "ERROR: No candidate or local chart to promote."
        exit 1
      fi
      chart_publish "${CHART_NAME}-${TAG}.tgz" "${PROD_CHART_REPO}"
      echo "Chart ${CHART_NAME}:${TAG} promoted to oci://${PROD_CHART_REPO}."
    - registry_mirror chart stable "${TAG}"
