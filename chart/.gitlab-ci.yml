.chart-common:
  variables:
    TRIVY_SCAN_REPORT_NAME_PREFIX: "chart"
    TRIVY_SCAN_REPORT_NAME: "${TRIVY_SCAN_REPORT_NAME_PREFIX}_${TRIVY_SCAN_REPORT_NAME_SUFFIX}"
    IAC_SCAN_PATH: "${CHART_DIR}"
    IGNORED_CVES_YQ_PATH: "iac.chart"
    SCAN_TYPE: config
    CONFIG_TYPE: ${TRIVY_SCAN_REPORT_NAME_PREFIX}

.chart-login: &chart-login
  - >
    echo "Logging into OCI registry for chart dependency resolution: ${CHART_REGISTRY}"
  - CHART_USER="${CHART_REGISTRY_USERNAME:-${CI_REGISTRY_USER:-gitlab-ci-token}}"
  - CHART_PASS="${CHART_REGISTRY_PASSWORD:-${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}}"
  - |
    if [[ -n "${CHART_REGISTRY}" ]]; then
      if [[ -z "${CHART_USER}" || -z "${CHART_PASS}" ]]; then
        echo "❌ ERROR: CHART_REGISTRY is set to '${CHART_REGISTRY}' but no credentials are available."
        echo "   Set CHART_REGISTRY_USERNAME/CHART_REGISTRY_PASSWORD (e.g. a deploy token with read_registry scope on the project hosting the chart dependencies) as CI/CD variables."
        echo "   CI_JOB_TOKEN only authenticates against this project's own registry (or a target project that explicitly allowlists it) — it will not work for an unrelated registry namespace."
        exit 1
      fi
      if ! echo "${CHART_PASS}" | helm registry login "${CHART_REGISTRY}" --username "${CHART_USER}" --password-stdin; then
        echo "❌ ERROR: helm registry login failed for ${CHART_REGISTRY} with user '${CHART_USER}'. Check that the credential is valid and has read_registry scope on the project/group hosting the chart dependencies."
        exit 1
      fi
    fi

.chart-dependency-update: &chart-dependency-update
  - helm dependency update "${CHART_DIR}/"

.chart-lint-workflow-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "lint" || $WORKFLOW == "chart-build-and-push")'
    - when: never

.chart-check-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "check" || $WORKFLOW == "chart-build-and-push" || $WORKFLOW == "chart-scan")'
    - when: never

.chart-docs-dependency-check-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "check" || $WORKFLOW == "chart-build-and-push")'
    - when: never

Chart:Check Existence:
  extends:
    - .chart-common
    - .check-job-common
    - .chart-check-rules
  script:
    # - *chart-login
    - RESOLVED_CHART_NAME="${CHART_NAME}"
    - |
      if [[ -z "${RESOLVED_CHART_NAME}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        RESOLVED_CHART_NAME=$(yq '.name // ""' "${CHART_DIR}/${CHART_FILE}" 2>/dev/null || true)
      fi
    - CHECK_VERSION="${TARGET_VERSION:-${CHART_RELEASE_VERSION}}"
    - |
      # OCI-based existence check disabled — charts are published to the GitLab Helm Package Registry.
      # See: https://docs.gitlab.com/user/packages/helm_repository/
      # if [[ "${CHECK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
      #   CHART_CHECK_REPO="${CHART_REPOSITORY}"
      # else
      #   CHART_CHECK_REPO="${CHART_REPOSITORY}${CHART_DEV_REPOSITORY_SUFFIX}"
      # fi
      #
      # if [[ -n "${CHART_REGISTRY}" ]]; then
      #   if [[ "${WORKFLOW}" == "chart-scan" ]]; then
      #     if [[ -f "${CHART_DIR}/${CHART_FILE}" && -z "${TARGET_VERSION}" ]]; then
      #       echo "✅ Local Helm chart '${CHART_DIR}/${CHART_FILE}' found. Ready for scanning."
      #     elif [[ -n "${CHECK_VERSION}" ]] && (helm show chart "oci://${CHART_REGISTRY}/${CHART_CHECK_REPO}/${RESOLVED_CHART_NAME}" --version "${CHECK_VERSION}" > /dev/null 2>&1 || helm show chart "oci://${CHART_REGISTRY}/${CHART_CHECK_REPO}" --version "${CHECK_VERSION}" > /dev/null 2>&1); then
      #       echo "✅ Remote chart version '${CHECK_VERSION}' exists in registry (${CHART_CHECK_REPO}). Ready for scanning."
      #     else
      #       echo "❌ Chart '${RESOLVED_CHART_NAME}' (version: ${CHECK_VERSION:-local}) not found in ${CHART_REGISTRY}/${CHART_CHECK_REPO}."
      #       exit 1
      #     fi
      #   else
      #     if helm show chart "oci://${CHART_REGISTRY}/${CHART_REPOSITORY}/${RESOLVED_CHART_NAME}" --version "${CHART_RELEASE_VERSION}" > /dev/null 2>&1; then
      #       echo "❌ Chart with version '${CHART_RELEASE_VERSION}' already exists in ${CHART_REGISTRY}/${CHART_REPOSITORY}/${RESOLVED_CHART_NAME}."
      #       exit 1
      #     else
      #       echo "✅ Chart version '${CHART_RELEASE_VERSION}' is available."
      #     fi
      #   fi
      if [[ -n "${CI_API_V4_URL}" && -n "${CI_PROJECT_ID}" && -n "${CI_JOB_TOKEN}" ]]; then
        echo "ℹ️  Checking chart existence in GitLab Package Registry..."
        PKG_CHECK_VERSION="${CHECK_VERSION}"
        if [[ "${WORKFLOW}" != "chart-scan" ]]; then
          PKG_CHECK_VERSION="${CHART_RELEASE_VERSION}"
        fi
        EXISTING_PKG=$(curl --silent --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_type=helm&package_name=${RESOLVED_CHART_NAME}&package_version=${PKG_CHECK_VERSION}" 2>/dev/null || true)
        PKG_COUNT=$(echo "${EXISTING_PKG}" | jq '. | length' 2>/dev/null || echo "0")

        if [[ "${WORKFLOW}" == "chart-scan" ]]; then
          if [[ -f "${CHART_DIR}/${CHART_FILE}" && -z "${TARGET_VERSION}" ]]; then
            echo "✅ Local Helm chart '${CHART_DIR}/${CHART_FILE}' found. Ready for scanning."
          elif [[ -n "${CHECK_VERSION}" && "${PKG_COUNT}" -gt 0 ]]; then
            echo "✅ Remote chart version '${CHECK_VERSION}' exists in GitLab Package Registry. Ready for scanning."
          else
            echo "❌ Chart '${RESOLVED_CHART_NAME}' (version: ${CHECK_VERSION:-local}) not found in GitLab Package Registry."
            exit 1
          fi
        else
          if [[ "${PKG_COUNT}" -gt 0 ]]; then
            echo "❌ Chart '${RESOLVED_CHART_NAME}' with version '${CHART_RELEASE_VERSION}' already exists in GitLab Package Registry."
            exit 1
          else
            echo "✅ Chart version '${CHART_RELEASE_VERSION}' is available in GitLab Package Registry."
          fi
        fi
      else
        echo "⚠️ Notice: GitLab Package Registry environment not available. Skipping remote chart existence check."
      fi
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
    - job: Common:Init
      artifacts: true
      optional: true

Chart:Check:README:
  extends:
    - .chart-common
    - .check-job-common
    - .chart-docs-dependency-check-rules
  script:
    - cd ${CHART_DIR}
    - MD5_CHART_DOCS=$(md5sum README.md)
    - helm-docs --template-files "README.gotmpl" --sort-values-order file --document-dependency-values
    - MD5_NEW_CHART_DOCS=$(md5sum README.md)
    - |
      if [[ "${MD5_CHART_DOCS}" != "${MD5_NEW_CHART_DOCS}" ]]; then
        echo "MD5 checksums do not match for README.md file. perform \`helm-docs --template-files README.gotmpl --sort-values-order file --document-dependency-values\`"
        exit 1
      fi

Chart:Check:Dependency:
  extends:
    - .chart-common
    - .check-job-common
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "check")'
    - when: never
  script:
    - |
      if cat "${CHART_DIR}/${CHART_FILE}" | grep -q "helm/dev"; then
        echo "dev registry found in ${CHART_FILE}. Only stable releases should be used in chart dependency."
        exit 1
      fi

Chart:Values:Lint:
  stage: lint
  variables:
    LINT_YAML_FILES: "${CHART_DIR}/values.yaml"
  extends:
    - .YAML:Lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "lint")'
    - when: never

Chart:Lint:
  stage: lint
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
  extends:
    - .chart-common
    - .chart-lint-workflow-rules
  script:
    - *chart-login
    - *chart-dependency-update
    - |
      if [[ -z "${HELM_TEST_VALUES}" ]]; then
        helm lint --strict -f "${CHART_DIR}/values.yaml" "${CHART_DIR}/"
      else
        echo "${HELM_TEST_VALUES}" > "${IAC_SCAN_PATH}/override.yaml"
        helm lint --strict -f "${CHART_DIR}/values.yaml" -f "${IAC_SCAN_PATH}/override.yaml" "${CHART_DIR}/"
      fi
  dependencies: []

.Chart:UnitTest:
  stage: test
  extends:
    - .chart-lint-workflow-rules
  variables:
    MOCK_CHART: test
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
  script:
    # Kept in script rather than before_script: the library default before_script does
    # `cd ${PROJECT_PATH}`, and declaring one here would silently replace it.
    - *chart-login
    - helm dependency update "${CHART_DIR}/${MOCK_CHART}"
    - helm unittest --strict --output-type JUnit --output-file unittest-report.xml "${CHART_DIR}/${MOCK_CHART}"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: unittest-report.xml
    paths:
      - unittest-report.xml
  dependencies: []

Chart:Build:
  stage: build
  extends:
    - .chart-common
    - .chart-build-workflow-rules
  script:
    - *chart-login
    - *chart-dependency-update
    - helm package "${CHART_DIR}/" --version "${CHART_PUSH_VERSION}" --app-version "${APP_PUSH_VERSION}"
  artifacts:
    name: Chart Package
    expose_as: Chart Package
    when: always
    expire_in: 1 week
    paths:
      - "${PROJECT_PATH}/${CHART_NAME}-${CHART_PUSH_VERSION}.tgz"
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Chart:Lint
      artifacts: false
      optional: true

Chart:Push:
  stage: push
  extends:
    - .chart-common
    - .chart-build-workflow-rules
  script:
    # - *chart-login
    - |
      CHART_PACKAGE_FILE="${CHART_NAME}-${CHART_PUSH_VERSION}.tgz"
      if [[ ! -f "${CHART_PACKAGE_FILE}" ]]; then
        echo "❌ ERROR: Chart package file '${CHART_PACKAGE_FILE}' not found."
        exit 1
      fi
    - |
      # OCI-based chart push disabled — using GitLab Helm Package Registry instead.
      # See: https://docs.gitlab.com/user/packages/helm_repository/
      # if [[ -n "${CHART_REGISTRY}" ]]; then
      #   echo "🌐 Pushing Helm chart to OCI registry: oci://${CHART_REGISTRY}/${CHART_PUSH_REPOSITORY}..."
      #   helm push "${CHART_PACKAGE_FILE}" "oci://${CHART_REGISTRY}/${CHART_PUSH_REPOSITORY}"
      #   {
      #     echo "### ⎈ Helm Chart Package Info"
      #     echo "- **📦 Name:** \`${CHART_NAME}\`"
      #     echo "- **🏷️ Version:** \`${CHART_PUSH_VERSION}\`"
      #     echo "- **🌐 Registry:** \`oci://${CHART_REGISTRY}/${CHART_PUSH_REPOSITORY}\`"
      #   } >> "${CHART_INFO_FILE_NAME}"
      #
      #   DEV_CHART_REPO="${CHART_REPOSITORY}${CHART_DEV_REPOSITORY_SUFFIX}"
      #   if [[ "${CHART_PUSH_REPOSITORY}" != "${DEV_CHART_REPO}" ]]; then
      #     if ! helm push "${CHART_PACKAGE_FILE}" "oci://${CHART_REGISTRY}/${DEV_CHART_REPO}"; then
      #       echo "⚠️ Notice: Optional dev mirror push failed for ${CHART_PACKAGE_FILE}"
      #     fi
      #   fi
      if [[ -n "${CI_API_V4_URL}" && -n "${CI_PROJECT_ID}" && -n "${CI_JOB_TOKEN}" ]]; then
        if [[ -n "${RC_VERSION_SUFFIX}" ]]; then
          HELM_CHANNEL="${HELM_CHANNEL:-dev}"
        else
          HELM_CHANNEL="${HELM_CHANNEL:-stable}"
        fi

        echo "📦 Pushing Helm chart to GitLab Package Registry (channel: ${HELM_CHANNEL})..."
        UPLOAD_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/${HELM_CHANNEL}/charts"

        RESPONSE=$(curl --fail-with-body --silent --show-error --request POST \
          --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
          --form "chart=@${CHART_PACKAGE_FILE}" \
          "${UPLOAD_URL}" 2>&1) || {
            echo "❌ ERROR: Failed to push Helm chart to GitLab Package Registry: ${RESPONSE}"
            exit 1
          }

        echo "✅ Successfully pushed Helm chart package '${CHART_NAME}:${CHART_PUSH_VERSION}' to GitLab Package Registry (${HELM_CHANNEL})."
        {
          echo "### ⎈ Helm Chart Package Info"
          echo "- **📦 Name:** \`${CHART_NAME}\`"
          echo "- **🏷️ Version:** \`${CHART_PUSH_VERSION}\`"
          echo "- **📦 Registry:** \`GitLab Package Registry (channel: ${HELM_CHANNEL})\`"
          echo "- **🔗 Endpoint:** \`${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/${HELM_CHANNEL}\`"
        } >> "${CHART_INFO_FILE_NAME}"

        if [[ -z "${RC_VERSION_SUFFIX}" && "${HELM_CHANNEL}" != "dev" ]]; then
          DEV_UPLOAD_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/dev/charts"
          echo "🔄 Mirroring release chart to GitLab Package Registry 'dev' channel..."
          if ! curl --fail-with-body --silent --show-error --request POST \
            --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
            --form "chart=@${CHART_PACKAGE_FILE}" \
            "${DEV_UPLOAD_URL}" > /dev/null 2>&1; then
            echo "⚠️ Notice: Optional dev mirror push to GitLab Package Registry failed for ${CHART_PACKAGE_FILE}"
          else
            echo "✅ Successfully mirrored to GitLab Package Registry 'dev' channel."
          fi
        fi
      else
        echo "❌ ERROR: GitLab CI package environment (CI_API_V4_URL, CI_PROJECT_ID, CI_JOB_TOKEN) is not available."
        exit 1
      fi
  artifacts:
    name: Chart Info
    expose_as: Chart Info
    when: always
    expire_in: 1 week
    paths:
      - "${PROJECT_PATH}/${CHART_INFO_FILE_NAME}"
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Chart:Build
      artifacts: true
      optional: false

Chart:Scan:
  extends:
    - .scan-script
    - .chart-common
    - .chart-scan-workflow-rules
  before_script:
    - cd ${PROJECT_PATH}
    - *chart-login
    - RESOLVED_CHART_NAME="${CHART_NAME}"
    - |
      if [[ -z "${RESOLVED_CHART_NAME}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        RESOLVED_CHART_NAME=$(yq '.name // ""' "${CHART_DIR}/${CHART_FILE}" 2>/dev/null || true)
      fi
    - CHECK_VERSION="${TARGET_VERSION:-}"
    - |
      if [[ -n "${CHECK_VERSION}" ]]; then
        # OCI-based chart pull disabled — charts live in the GitLab Helm Package Registry.
        # See: https://docs.gitlab.com/user/packages/helm_repository/
        # if [[ -n "${CHART_REGISTRY}" ]]; then
        #   if [[ "${CHECK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        #     CHART_SCAN_REPO="${CHART_REPOSITORY}"
        #     echo "🌐 Stable chart version '${CHECK_VERSION}' detected — pulling from production registry: oci://${CHART_REGISTRY}/${CHART_SCAN_REPO}/${RESOLVED_CHART_NAME}..."
        #   else
        #     CHART_SCAN_REPO="${CHART_REPOSITORY}${CHART_DEV_REPOSITORY_SUFFIX}"
        #     echo "🛠️ Candidate/dev chart version '${CHECK_VERSION}' detected — pulling from dev registry: oci://${CHART_REGISTRY}/${CHART_SCAN_REPO}/${RESOLVED_CHART_NAME}..."
        #   fi
        #   mkdir -p _scan_chart
        #   if ! helm pull "oci://${CHART_REGISTRY}/${CHART_SCAN_REPO}/${RESOLVED_CHART_NAME}" --version "${CHECK_VERSION}" --untar --untardir _scan_chart/ 2>/dev/null; then
        #     helm pull "oci://${CHART_REGISTRY}/${CHART_SCAN_REPO}" --version "${CHECK_VERSION}" --untar --untardir _scan_chart/
        #   fi
        if [[ -n "${CI_API_V4_URL}" && -n "${CI_PROJECT_ID}" ]]; then
          CHANNEL="stable"
          if [[ ! "${CHECK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="dev"
          fi
          echo "📦 Pulling Helm chart '${RESOLVED_CHART_NAME}:${CHECK_VERSION}' from GitLab Package Registry (channel: ${CHANNEL})..."
          mkdir -p _scan_chart
          helm repo add gitlab-scan "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/${CHANNEL}" \
            --username gitlab-ci-token --password "${CI_JOB_TOKEN}" > /dev/null 2>&1 || true
          helm repo update gitlab-scan > /dev/null 2>&1 || true
          helm pull "gitlab-scan/${RESOLVED_CHART_NAME}" --version "${CHECK_VERSION}" --untar --untardir _scan_chart/
        fi
        PULLED_NAME=$(ls -1 _scan_chart 2>/dev/null | head -n1 || true)
        if [[ -n "${PULLED_NAME}" && -d "_scan_chart/${PULLED_NAME}" ]]; then
          SCAN_CHART_PATH="_scan_chart/${PULLED_NAME}"
        else
          SCAN_CHART_PATH="${CHART_DIR}"
        fi
      else
        SCAN_CHART_PATH="${CHART_DIR}"
      fi
    - export IAC_SCAN_PATH="${SCAN_CHART_PATH}"
    - >
      echo "Scanning chart at: ${IAC_SCAN_PATH}"
    - *chart-dependency-update
    - |
      if [[ -z "${HELM_TEST_VALUES}" ]]; then
        helm template debug "${SCAN_CHART_PATH}" -f "${SCAN_CHART_PATH}/values.yaml" > /dev/null
      else
        export TRIVY_HELM_VALUES_FILE="${CI_PROJECT_DIR}/${PROJECT_PATH}/_scan_override.yaml"
        echo "${HELM_TEST_VALUES}" > "${TRIVY_HELM_VALUES_FILE}"
        helm template debug "${SCAN_CHART_PATH}" -f "${SCAN_CHART_PATH}/values.yaml" -f "${TRIVY_HELM_VALUES_FILE}" > /dev/null
      fi
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
    - job: Chart:Lint
      artifacts: false
      optional: true
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Trivy:Cache:Warm
      artifacts: false
      optional: true
  artifacts:
    name: Chart Scan Report
    expose_as: Chart Scan Report
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.md
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.json
      - ${PROJECT_PATH}/${CHART_CVE_INFO_FILE_NAME}
    reports:
      junit: ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit

