      #     echo "📦 Packaging local chart for production release..."
      #     helm dependency update "${CHART_DIR}/"
      #     helm package "${CHART_DIR}" --version "${TAG}" --app-version "${TAG}"
      #     helm push "${CHART_NAME}-${TAG}.tgz" "oci://${PROD_CHART_REPO}"
      #     echo "✅ Helm chart packaged and pushed to production."
      #   else
      #     echo "⚠️ Notice: No chart found to promote. Skipping chart promotion."
      #   fi
      if [[ -n "${CI_API_V4_URL}" && -n "${CI_PROJECT_ID}" && -n "${CI_JOB_TOKEN}" ]]; then
        PULLED=0
        mkdir -p _promote
        helm repo add gitlab-dev "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/dev" \
          --username gitlab-ci-token --password "${CI_JOB_TOKEN}" > /dev/null 2>&1 || true
        helm repo update gitlab-dev > /dev/null 2>&1 || true

        if [[ -n "${DEV_CANDIDATE_CHART_VERSION}" ]] && helm pull "gitlab-dev/${CHART_NAME}" --version "${DEV_CANDIDATE_CHART_VERSION}" --untar --untardir _promote 2>/dev/null; then
          echo "📦 Successfully pulled candidate Helm chart from GitLab Package Registry: ${CHART_NAME}:${DEV_CANDIDATE_CHART_VERSION}"
          PULLED=1
        elif [[ -n "${DEV_CANDIDATE_VERSION}" ]] && helm pull "gitlab-dev/${CHART_NAME}" --version "${DEV_CANDIDATE_VERSION}" --untar --untardir _promote 2>/dev/null; then
          echo "📦 Successfully pulled candidate Helm chart from GitLab Package Registry: ${CHART_NAME}:${DEV_CANDIDATE_VERSION}"
          PULLED=1
        elif [[ -n "${UPSTREAM_PIPELINE_ID}" ]] && helm pull "gitlab-dev/${CHART_NAME}" --version "${TAG}-rc.${UPSTREAM_PIPELINE_ID}" --untar --untardir _promote 2>/dev/null; then
          echo "📦 Successfully pulled candidate Helm chart from GitLab Package Registry: ${CHART_NAME}:${TAG}-rc.${UPSTREAM_PIPELINE_ID}"
          PULLED=1
        fi

        STABLE_UPLOAD_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"
        if [[ ${PULLED} -eq 1 ]]; then
          echo "🚀 Re-packaging candidate at ${TAG} and publishing to GitLab Package Registry 'stable' channel..."
          helm package "_promote/${CHART_NAME}" --version "${TAG}" --app-version "${TAG}"
          curl --fail-with-body --silent --show-error --request POST \
            --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
            --form "chart=@${CHART_NAME}-${TAG}.tgz" \
            "${STABLE_UPLOAD_URL}"
          rm -rf _promote
          echo "✅ Helm chart published to GitLab Package Registry (stable channel)."
        elif [[ -f "${CHART_DIR}/${CHART_FILE}" ]]; then
          echo "📦 Packaging local chart for production release..."
          helm dependency update "${CHART_DIR}/"
          helm package "${CHART_DIR}" --version "${TAG}" --app-version "${TAG}"
          curl --fail-with-body --silent --show-error --request POST \
            --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
            --form "chart=@${CHART_NAME}-${TAG}.tgz" \
            "${STABLE_UPLOAD_URL}"
          echo "✅ Helm chart packaged and published to GitLab Package Registry (stable channel)."
        else
          echo "⚠️ Notice: No chart found to promote. Skipping chart promotion."
        fi
      else
        echo "⚠️ Notice: GitLab Package Registry environment not available. Skipping chart promotion."
      fi
