.chart-common:
  variables:
    TRIVY_SCAN_REPORT_NAME_PREFIX: "chart"
    TRIVY_SCAN_REPORT_NAME: "${TRIVY_SCAN_REPORT_NAME_PREFIX}_${TRIVY_SCAN_REPORT_NAME_SUFFIX}"
    IAC_SCAN_PATH: "${CHART_DIR}"
    IGNORED_CVES_YQ_PATH: "iac.chart"
    SCAN_TYPE: config
    CONFIG_TYPE: ${TRIVY_SCAN_REPORT_NAME_PREFIX}

.chart-registry:
  script: &chart-registry |
    chart_login() {
      local registry="$1" user="$2" password="$3"
      case "${registry}" in
        ""|*://*|*/*|*@*|*[[:space:]]*) echo "ERROR: Chart registry must be an OCI hostname, optionally with a port." >&2; return 1 ;;
      esac
      if [[ -z "${user}" || -z "${password}" ]]; then
        echo "ERROR: Set the chart registry username/password pair for ${registry}." >&2
        return 1
      fi
      if ! printf '%s' "${password}" | helm registry login "${registry}" --username "${user}" --password-stdin >/dev/null 2>&1; then
        echo "ERROR: Chart registry authentication failed for ${registry}; check credentials and registry access." >&2
        return 1
      fi
    }

    chart_registry_setup() {
      if [[ -n "${CHART_REGISTRY:-}" ]]; then
        case "${CHART_REGISTRY}" in
          *://*|*/*|*@*|*[[:space:]]*) echo "ERROR: CHART_REGISTRY must be an OCI hostname, optionally with a port." >&2; return 1 ;;
        esac
        : "${CHART_REPOSITORY:?Set CHART_REPOSITORY to the OCI namespace/path, without the chart name}"
        PROD_CHART_REPO="${CHART_REPOSITORY}"
        DEV_CHART_REPO="${CHART_REPOSITORY}${CHART_DEV_REPOSITORY_SUFFIX-/dev}"
        case "${CHART_REGISTRY}" in
          docker.io|index.docker.io|registry-1.docker.io) DEV_CHART_REPO="${PROD_CHART_REPO}" ;;
        esac
        local user="${CHART_REGISTRY_USERNAME:-}" password="${CHART_REGISTRY_PASSWORD:-}"
        if [[ "${CHART_REGISTRY}" == "${CI_REGISTRY:-}" && -z "${user}${password}" ]]; then
          user="${CI_REGISTRY_USER:-gitlab-ci-token}"
          password="${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN:-}}"
        fi
        chart_login "${CHART_REGISTRY}" "${user}" "${password}" || return 1
      else
        : "${CI_API_V4_URL:?GitLab package publishing requires CI_API_V4_URL}"
        : "${CI_PROJECT_ID:?GitLab package publishing requires CI_PROJECT_ID}"
        : "${CI_JOB_TOKEN:?GitLab package publishing requires CI_JOB_TOKEN}"
        PROD_CHART_REPO=stable
        DEV_CHART_REPO=dev
      fi
    }

    chart_dependency_login() {
      if [[ -n "${CHART_DEPENDENCY_REGISTRY:-}" ]]; then
        chart_login "${CHART_DEPENDENCY_REGISTRY}" "${CHART_DEPENDENCY_REGISTRY_USERNAME:-}" "${CHART_DEPENDENCY_REGISTRY_PASSWORD:-}"
      elif [[ -n "${CHART_REGISTRY:-}" ]]; then
        chart_registry_setup
      fi
    }

    # Return 0 for present, 1 for confirmed absence, 2 for an operational error.
    chart_exists() {
      local version="$1" repository="$2" output page=1 count
      if [[ -n "${CHART_REGISTRY:-}" ]]; then
        if output=$(helm show chart "oci://${CHART_REGISTRY}/${repository}/${RESOLVED_CHART_NAME}" --version "${version}" 2>&1); then
          return 0
        fi
        case "${output}" in
          *401*|*403*|*Unauthorized*|*unauthorized*|*denied*|*timeout*|*connection*|*"no such host"*|*x509*|*executable*|*"command not found"*) ;;
          *"not found"*|*"404 Not Found"*|*MANIFEST_UNKNOWN*|*NAME_UNKNOWN*) return 1 ;;
        esac
        echo "ERROR: OCI chart lookup failed; availability cannot be confirmed." >&2
        return 2
      fi
      while :; do
        if ! output=$(curl --fail --silent --show-error --get --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --data-urlencode "package_type=helm" --data-urlencode "package_name=${RESOLVED_CHART_NAME}" \
          --data-urlencode "package_version=${version}" --data-urlencode "per_page=100" --data-urlencode "page=${page}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages" 2>/dev/null); then
          echo "ERROR: GitLab package lookup failed; check job-token access and service availability." >&2
          return 2
        fi
        if ! count=$(printf '%s' "${output}" | jq -er 'if type == "array" and all(.[]; type == "object" and (.name | type) == "string" and (.version | type) == "string") then length else error("invalid packages") end' 2>/dev/null); then
          echo "ERROR: Invalid GitLab package response." >&2
          return 2
        fi
        if printf '%s' "${output}" | jq -e --arg name "${RESOLVED_CHART_NAME}" --arg version "${version}" \
          'any(.[]; .name == $name and .version == $version)' >/dev/null; then
          return 0
        fi
        [[ "${count}" -eq 100 ]] || return 1
        page=$((page + 1))
      done
    }

    chart_pull() {
      local version="$1" repository="$2" destination="$3" ref
      if [[ -n "${CHART_REGISTRY:-}" ]]; then
        ref="oci://${CHART_REGISTRY}/${repository}/${RESOLVED_CHART_NAME}"
      else
        if ! helm repo add ci-chart "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/${repository}" \
          --force-update --username gitlab-ci-token --password "${CI_JOB_TOKEN}" >/dev/null 2>&1; then
          echo "ERROR: Cannot load GitLab Helm channel ${repository}." >&2
          return 1
        fi
        ref="ci-chart/${RESOLVED_CHART_NAME}"
      fi
      if ! helm pull "${ref}" --version "${version}" --untar --untardir "${destination}" >/dev/null 2>&1; then
        echo "ERROR: Cannot pull chart ${RESOLVED_CHART_NAME}:${version} from ${repository}." >&2
        return 1
      fi
    }

    chart_publish() {
      local package="$1" repository="$2"
      if [[ -n "${CHART_REGISTRY:-}" ]]; then
        if ! helm push "${package}" "oci://${CHART_REGISTRY}/${repository}" >/dev/null 2>&1; then
          echo "ERROR: OCI chart push failed; no GitLab package fallback was attempted." >&2
          return 1
        fi
      elif ! curl --fail --silent --show-error --output /dev/null --request POST \
        --user "gitlab-ci-token:${CI_JOB_TOKEN}" --form "chart=@${package}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/${repository}/charts" 2>/dev/null; then
        echo "ERROR: GitLab Helm package upload failed." >&2
        return 1
      fi
    }

.chart-login:
  script: &chart-login
    - *chart-registry
    - chart_dependency_login

.chart-dependency-update:
  script: &chart-dependency-update
    - helm dependency update "${CHART_DIR}/"

.chart-lint-workflow-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "lint" || $WORKFLOW == "chart-build-and-push")'
    - when: never

.chart-check-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "check" || $WORKFLOW == "chart-build-and-push" || $WORKFLOW == "chart-scan")'
    - when: never

.chart-docs-dependency-check-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "check" || $WORKFLOW == "chart-build-and-push")'
    - when: never

Chart:Check Existence:
  extends:
    - .chart-common
    - .check-job-common
    - .chart-check-rules
  script:
    - *chart-registry
    - |
      RESOLVED_CHART_NAME="${CHART_NAME:-}"
      if [[ -z "${RESOLVED_CHART_NAME}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        RESOLVED_CHART_NAME=$(yq '.name // ""' "${CHART_DIR}/${CHART_FILE}")
      fi
      if [[ "${WORKFLOW:-}" == "chart-scan" && -z "${TARGET_VERSION:-}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        echo "Local chart found; no remote lookup needed."
        exit 0
      fi
      : "${RESOLVED_CHART_NAME:?Chart name is required}"
      chart_registry_setup
      CHECK_VERSION="${CHART_RELEASE_VERSION:-}"
      CHECK_REPO="${PROD_CHART_REPO}"
      if [[ "${WORKFLOW:-}" == "chart-scan" ]]; then
        CHECK_VERSION="${TARGET_VERSION:?TARGET_VERSION is required for a remote scan}"
        [[ "${CHECK_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || CHECK_REPO="${DEV_CHART_REPO}"
      fi
      : "${CHECK_VERSION:?Chart version is required}"
      if chart_exists "${CHECK_VERSION}" "${CHECK_REPO}"; then
        if [[ "${WORKFLOW:-}" != "chart-scan" ]]; then
          echo "ERROR: Chart ${RESOLVED_CHART_NAME}:${CHECK_VERSION} already exists. Bump the version."
          exit 1
        fi
        echo "Remote chart version exists."
      else
        RESULT=$?
        [[ "${RESULT}" -eq 1 ]] || exit "${RESULT}"
        if [[ "${WORKFLOW:-}" == "chart-scan" ]]; then
          echo "ERROR: Remote chart version does not exist."
          exit 1
        fi
        echo "Chart version is available."
      fi
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
    - job: Common:Init
      artifacts: true
      optional: true

Chart:Check:README:
  extends:
    - .chart-common
    - .check-job-common
    - .chart-docs-dependency-check-rules
  script:
    - cd ${CHART_DIR}
    - MD5_CHART_DOCS=$(md5sum README.md)
    - helm-docs --template-files "README.gotmpl" --sort-values-order file --document-dependency-values
    - MD5_NEW_CHART_DOCS=$(md5sum README.md)
    - |
      if [[ "${MD5_CHART_DOCS}" != "${MD5_NEW_CHART_DOCS}" ]]; then
        echo "MD5 checksums do not match for README.md file. perform \`helm-docs --template-files README.gotmpl --sort-values-order file --document-dependency-values\`"
        exit 1
      fi

Chart:Check:Dependency:
  extends:
    - .chart-common
    - .check-job-common
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "check")'
    - when: never
  script:
    - |
      if cat "${CHART_DIR}/${CHART_FILE}" | grep -q "helm/dev"; then
        echo "dev registry found in ${CHART_FILE}. Only stable releases should be used in chart dependency."
        exit 1
      fi

Chart:Values:Lint:
  stage: lint
  variables:
    LINT_YAML_FILES: "${CHART_DIR}/values.yaml"
  extends:
    - .YAML:Lint
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH || ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ $MASTER_BRANCH_REGEX && $CI_MERGE_REQUEST_TARGET_BRANCH_PROTECTED == "true"))'
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - if: '$CI_PIPELINE_SOURCE =~ /^(web|api)$/ && ($WORKFLOW == "full-pipeline" || $WORKFLOW == "lint")'
    - when: never

Chart:Lint:
  stage: lint
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
  extends:
    - .chart-common
    - .chart-lint-workflow-rules
  script:
    - *chart-login
    - *chart-dependency-update
    - |
      if [[ -z "${HELM_TEST_VALUES}" ]]; then
        helm lint --strict -f "${CHART_DIR}/values.yaml" "${CHART_DIR}/"
      else
        echo "${HELM_TEST_VALUES}" > "${IAC_SCAN_PATH}/override.yaml"
        helm lint --strict -f "${CHART_DIR}/values.yaml" -f "${IAC_SCAN_PATH}/override.yaml" "${CHART_DIR}/"
      fi
  dependencies: []

.Chart:UnitTest:
  stage: test
  extends:
    - .chart-lint-workflow-rules
  variables:
    MOCK_CHART: tests
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
  script:
    # Kept in script rather than before_script: the library default before_script does
    # `cd ${PROJECT_PATH}`, and declaring one here would silently replace it.
    - *chart-login
    - chart_path="${CHART_DIR}/${MOCK_CHART}"
    - |
      if [[ ! -f "${chart_path}/Chart.yaml" ]]; then
        echo "ERROR: Mock chart '${chart_path}' lacks Chart.yaml." >&2
        exit 1
      fi
    - |
      if ! compgen -G "${chart_path}/tests/*_test.yaml" >/dev/null; then
        echo "ERROR: No Helm unittest suites under ${chart_path}/tests/." >&2
        exit 1
      fi
    - helm dependency update "${chart_path}"
    - helm unittest --strict --output-type JUnit --output-file unittest-report.xml --file "${chart_path}/tests/*_test.yaml" "${chart_path}"
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: unittest-report.xml
    paths:
      - unittest-report.xml
  dependencies: []

Chart:Build:
  stage: build
  extends:
    - .chart-common
    - .chart-build-workflow-rules
  script:
    - *chart-login
    - *chart-dependency-update
    - helm package "${CHART_DIR}/" --version "${CHART_PUSH_VERSION}" --app-version "${APP_PUSH_VERSION}"
  artifacts:
    name: Chart Package
    expose_as: Chart Package
    when: always
    expire_in: 1 week
    paths:
      - "${PROJECT_PATH}/${CHART_NAME}-${CHART_PUSH_VERSION}.tgz"
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Chart:Lint
      artifacts: false
      optional: true

Chart:Push:
  stage: push
  extends:
    - .chart-common
    - .chart-build-workflow-rules
  script:
    - *chart-registry
    - chart_registry_setup
    - |
      CHART_PACKAGE_FILE="${CHART_NAME}-${CHART_PUSH_VERSION}.tgz"
      [[ -f "${CHART_PACKAGE_FILE}" ]] || { echo "ERROR: Chart package ${CHART_PACKAGE_FILE} not found."; exit 1; }
      PUSH_REPO="${PROD_CHART_REPO}"
      [[ -z "${RC_VERSION_SUFFIX:-}" ]] || PUSH_REPO="${DEV_CHART_REPO}"
      if [[ -z "${CHART_REGISTRY:-}" ]]; then
        PUSH_REPO="${HELM_CHANNEL:-${PUSH_REPO}}"
      fi
      chart_publish "${CHART_PACKAGE_FILE}" "${PUSH_REPO}"
      if [[ -z "${RC_VERSION_SUFFIX:-}" && "${PUSH_REPO}" != "${DEV_CHART_REPO}" ]]; then
        if ! chart_publish "${CHART_PACKAGE_FILE}" "${DEV_CHART_REPO}"; then
          echo "WARNING: Optional dev mirror failed; the primary chart publish succeeded."
        fi
      fi
      {
        echo "### Helm Chart Package Info"
        echo "- Name: ${CHART_NAME}"
        echo "- Version: ${CHART_PUSH_VERSION}"
        echo "- Registry: ${CHART_REGISTRY:-GitLab Helm Package Registry}"
        echo "- Repository/channel: ${PUSH_REPO}"
      } > "${CHART_INFO_FILE_NAME}"
      cat "${CHART_INFO_FILE_NAME}"
  artifacts:
    name: Chart Info
    expose_as: Chart Info
    when: always
    expire_in: 1 week
    paths:
      - "${PROJECT_PATH}/${CHART_INFO_FILE_NAME}"
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Chart:Build
      artifacts: true
      optional: false

Chart:Scan:
  extends:
    - .scan-script
    - .chart-common
    - .chart-scan-workflow-rules
  before_script:
    - cd "${PROJECT_PATH}"
    - *chart-registry
    - |
      RESOLVED_CHART_NAME="${CHART_NAME:-}"
      if [[ -z "${RESOLVED_CHART_NAME}" && -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        RESOLVED_CHART_NAME=$(yq '.name // ""' "${CHART_DIR}/${CHART_FILE}")
      fi
      SCAN_CHART_PATH="${CHART_DIR}"
      if [[ -n "${TARGET_VERSION:-}" ]]; then
        : "${RESOLVED_CHART_NAME:?Chart name is required}"
        chart_registry_setup
        SCAN_REPO="${PROD_CHART_REPO}"
        [[ "${TARGET_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || SCAN_REPO="${DEV_CHART_REPO}"
        SCAN_TEMP=$(mktemp -d)
        trap 'rm -rf "${SCAN_TEMP}"' EXIT
        chart_pull "${TARGET_VERSION}" "${SCAN_REPO}" "${SCAN_TEMP}"
        SCAN_CHART_PATH="${SCAN_TEMP}/${RESOLVED_CHART_NAME}"
        [[ -f "${SCAN_CHART_PATH}/${CHART_FILE}" ]] || { echo "ERROR: Pulled chart is missing its manifest."; exit 1; }
      fi
      chart_dependency_login
    - export IAC_SCAN_PATH="${SCAN_CHART_PATH}"
    - >
      echo "Scanning chart at: ${IAC_SCAN_PATH}"
    - helm dependency update "${SCAN_CHART_PATH}/"
    - |
      if [[ -z "${HELM_TEST_VALUES}" ]]; then
        helm template debug "${SCAN_CHART_PATH}" -f "${SCAN_CHART_PATH}/values.yaml" > /dev/null
      else
        export TRIVY_HELM_VALUES_FILE="${CI_PROJECT_DIR}/${PROJECT_PATH}/_scan_override.yaml"
        echo "${HELM_TEST_VALUES}" > "${TRIVY_HELM_VALUES_FILE}"
        helm template debug "${SCAN_CHART_PATH}" -f "${SCAN_CHART_PATH}/values.yaml" -f "${TRIVY_HELM_VALUES_FILE}" > /dev/null
      fi
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
    - job: Chart:Lint
      artifacts: false
      optional: true
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Trivy:Cache:Warm
      artifacts: false
      optional: true
  artifacts:
    name: Chart Scan Report
    expose_as: Chart Scan Report
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.md
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.json
      - ${PROJECT_PATH}/${CHART_CVE_INFO_FILE_NAME}
    reports:
      junit: ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit

Chart:Promote:
  stage: release
  extends:
    - .release-rules
    - .chart-common
  needs:
    - job: Common:Init
      artifacts: true
      optional: false
  script:
    - cd "${PROJECT_PATH}"
    - *chart-registry
    - chart_registry_setup
    - |
      : "${CHART_NAME:?Chart name is required}"
      : "${TAG:?Release tag is required}"
      RESOLVED_CHART_NAME="${CHART_NAME}"
      PROMOTE_TEMP=$(mktemp -d)
      trap 'rm -rf "${PROMOTE_TEMP}"' EXIT
      PULLED=0
      CANDIDATES=("${DEV_CANDIDATE_CHART_VERSION:-}" "${DEV_CANDIDATE_VERSION:-}")
      [[ -z "${UPSTREAM_PIPELINE_ID:-}" ]] || CANDIDATES+=("${TAG}-rc.${UPSTREAM_PIPELINE_ID}")
      [[ -z "${CHART_REGISTRY:-}" ]] || CANDIDATES+=("${TAG}")
      for CANDIDATE in "${CANDIDATES[@]}"; do
        [[ -n "${CANDIDATE}" ]] || continue
        if chart_exists "${CANDIDATE}" "${DEV_CHART_REPO}"; then
          chart_pull "${CANDIDATE}" "${DEV_CHART_REPO}" "${PROMOTE_TEMP}"
          PULLED=1
          break
        else
          RESULT=$?
          [[ "${RESULT}" -eq 1 ]] || exit "${RESULT}"
        fi
      done
      if [[ "${PULLED}" -eq 1 ]]; then
        helm package "${PROMOTE_TEMP}/${CHART_NAME}" --version "${TAG}" --app-version "${TAG}"
      elif [[ -f "${CHART_DIR}/${CHART_FILE}" ]]; then
        echo "WARNING: No candidate found; packaging the working tree. These bytes were not scanned as a candidate."
        chart_dependency_login
        helm dependency update "${CHART_DIR}/"
        helm package "${CHART_DIR}" --version "${TAG}" --app-version "${TAG}"
      else
        echo "ERROR: No candidate or local chart to promote."
        exit 1
      fi
      chart_publish "${CHART_NAME}-${TAG}.tgz" "${PROD_CHART_REPO}"
      echo "Chart ${CHART_NAME}:${TAG} promoted to ${PROD_CHART_REPO}."
