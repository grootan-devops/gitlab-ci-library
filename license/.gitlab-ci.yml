License:Scan:
  stage: security
  variables:
    TRIVY_SCAN_REPORT_NAME_PREFIX: license
    TRIVY_SCAN_REPORT_NAME: ${TRIVY_SCAN_REPORT_NAME_PREFIX}_${TRIVY_SCAN_REPORT_NAME_SUFFIX}
    SCAN_TYPE: ${TRIVY_SCAN_REPORT_NAME_PREFIX}
  extends:
    - .scan-script
    - .license-scan-workflow-rules
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
  artifacts:
    name: License Scan Report
    expose_as: License Scan Report
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.md
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.json
      - ${PROJECT_PATH}/${LICENSE_INFO_FILE_NAME}
    reports:
      junit: ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit
