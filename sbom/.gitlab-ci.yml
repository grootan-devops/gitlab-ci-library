SBOM:Generate:
  stage: build
  extends:
    - .sbom-scan-workflow-rules
  variables:
    TRIVY_CACHE_DIR: ${CI_PROJECT_DIR}/.trivycache
  script:
    - TRIVY_ARGS="--skip-java-db-update"
    - |
      if [[ "${TRIVY_ENABLE_JAVA_SCAN}" == "true" || -f "pom.xml" || -f "${PROJECT_PATH}/pom.xml" ]]; then
        if [[ -d "${CI_PROJECT_DIR}/${PROJECT_PATH}/.m2/repository" ]]; then
          mkdir -p ~/.m2
          ln -sf "${CI_PROJECT_DIR}/${PROJECT_PATH}/.m2/repository" ~/.m2/repository 2>/dev/null || true
        elif command -v mvn >/dev/null 2>&1; then
          echo "WARNING: Maven cache did not restore - resolving dependencies inline. Instantiate Dependency:Download to avoid this."
          (cd "${PROJECT_PATH}" && (mvn dependency:go-offline -q -B -DskipTests || mvn dependency:resolve -q -B -DskipTests || true))
        fi
      fi
    - trivy fs --format cyclonedx --output ${SBOM_FILE} --skip-version-check --skip-db-update ${TRIVY_ARGS} .
  artifacts:
    name: SBOM
    expose_as: SBOM
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${SBOM_FILE}
  cache:
    - key: trivy-db
      when: always
      policy: pull
      paths:
        - ${CI_PROJECT_DIR}/.trivycache
    - key:
        files:
          - pom.xml
        prefix: ${PROJECT_CACHE_KEY}
      when: always
      policy: pull
      paths:
        - ${PROJECT_PATH}/.m2
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Trivy:Cache:Warm
      artifacts: false
      optional: true
    - job: Dependency:Download
      artifacts: false
      optional: true

SBOM:Scan:
  variables:
    SCAN_TYPE: sbom
    TRIVY_SCAN_REPORT_NAME_PREFIX: sbom
    TRIVY_SCAN_REPORT_NAME: ${TRIVY_SCAN_REPORT_NAME_PREFIX}_${TRIVY_SCAN_REPORT_NAME_SUFFIX}
  extends:
    - .scan-script
    - .sbom-scan-workflow-rules
  artifacts:
    name: SBOM Scan Report
    expose_as: SBOM Scan Report
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.md
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.json
      - ${PROJECT_PATH}/${SBOM_CVE_INFO_FILE_NAME}
    reports:
      junit: ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Trivy:Cache:Warm
      artifacts: false
      optional: true
    - job: SBOM:Generate
      artifacts: true
      optional: false
