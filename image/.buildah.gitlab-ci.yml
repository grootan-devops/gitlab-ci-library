Image:Build:
  stage: build
  image: ${BUILDAH_BUILD_IMAGE_REPO}:${BUILDAH_BUILD_IMAGE_TAG}
  extends:
    - .image-common
  # variables:
  #   BASE_IMAGE_REPO: ""
  #   BASE_IMAGE_TAG: ""
  #   CONTAINER_ENV_VARS: ""
  #   REQUIRED_PKGS: ""
  #   REQUIRED_RPMS: ""
  #   INSTALL_PKGS: ""
  #   FORCE_REMOVE_PKGS: ""
  #   RUN_IN_CONTAINER: ""
  #   CONTAINER_PATH_ENV: ""
  #   CONTAINER_ENTRYPOINT: ""   # declared-but-empty CLEARS the inherited entrypoint;
  #                              # omit the variable entirely to inherit it unchanged
  #   CONTAINER_CMD: ""
  script:
    # https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/8/html/building_running_and_managing_containers/assembly_building-container-images-with-buildah_building-running-and-managing-containers#proc_creating-images-from-scratch-with-buildah_assembly_building-container-images-with-buildah
    # https://www.mankier.com/package/buildah
    - set -e
    - chmod +x ${BUILDAH_SCRIPT_FILE_NAME}
    - BUILDAH_CREDS=""
    - REG_USER="${IMAGE_REGISTRY_USERNAME:-${CI_REGISTRY_USER:-gitlab-ci-token}}"
    - REG_PASS="${IMAGE_REGISTRY_PASSWORD:-${CI_REGISTRY_PASSWORD:-${CI_JOB_TOKEN}}}"
    - |
      if [[ -z "${REG_USER}" || -z "${REG_PASS}" ]]; then
        echo "❌ ERROR: No registry credentials available to pull the base image."
        echo "   Set IMAGE_REGISTRY_USERNAME/IMAGE_REGISTRY_PASSWORD (e.g. a deploy token with read_registry scope on the project hosting ${BASE_IMAGE_REPO}) as CI/CD variables."
        exit 1
      fi
    - BUILDAH_CREDS="--creds=${REG_USER}:${REG_PASS}"
    - BASE_CONTAINER=$(buildah from ${BUILDAH_CREDS} ${BASE_IMAGE_REPO}:${BASE_IMAGE_TAG})
    - |
      run_in_container_mount() {
        buildah run ${BASE_CONTAINER} bash -c "${1}"
      }
    - CONTAINER_MOUNT=$(buildah mount ${BASE_CONTAINER})
    - DNF_INSTALLROOT_ARG="--installroot ${CONTAINER_MOUNT} --releasever 9 --setopt=install_weak_deps=False --nodocs"
    - cp /etc/yum.repos.d/* ${CONTAINER_MOUNT}/etc/yum.repos.d
    - cp -r /etc/pki/rpm-gpg ${CONTAINER_MOUNT}/etc/pki
    - buildah config --user root ${BASE_CONTAINER}
    - dnf install ${DNF_INSTALL_ARG} ${DNF_INSTALLROOT_ARG} microdnf
    - run_in_container_mount "microdnf update ${DNF_INSTALL_ARG} && microdnf upgrade ${DNF_INSTALL_ARG}"
    - |
      if [[ -n "${CONTAINER_ENV_VARS}" ]]; then
        for VAR in ${CONTAINER_ENV_VARS}; do
          buildah config --env "${VAR}=${!VAR}" "${BASE_CONTAINER}"
        done
      fi
    - |
      if [[ -n "${INSTALL_PKGS}" ]]; then
        buildah run --network host "${BASE_CONTAINER}" bash -c "microdnf install -y ${DNF_INSTALL_ARG} ${INSTALL_PKGS}"
      fi
    - |
      if [[ -n "${REQUIRED_RPMS}" ]]; then
        buildah run "${BASE_CONTAINER}" bash -c "rpm -Uvh --excludedocs ${REQUIRED_RPMS}"
      fi
    - |
      if [[ -f "./${BUILDAH_SCRIPT_FILE_NAME}" ]]; then
        source "./${BUILDAH_SCRIPT_FILE_NAME}"
      fi
    - |
      if [[ -n "${CONTAINER_PATH_ENV}" ]]; then
        # 1. Extract the existing PATH from the container's internal metadata
        CURRENT_PATH=$(buildah inspect --format '{{range .OCIv1.Config.Env}}{{println .}}{{end}}' "${BASE_CONTAINER}" | grep '^PATH=' | cut -d= -f2-)

        # 2. Append our new path to the existing one (or use a safe fallback if empty)
        if [[ -n "${CURRENT_PATH}" ]]; then
          NEW_PATH="${CONTAINER_PATH_ENV}:${CURRENT_PATH}"
        else
          NEW_PATH="${CONTAINER_PATH_ENV}:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        fi

        # 3. Apply the combined PATH back to the container
        buildah config --env PATH="${NEW_PATH}" "${BASE_CONTAINER}"
        echo "Updated Container PATH to: ${NEW_PATH}"
      fi
    - |
      if [[ -n "${CONTAINER_ENTRYPOINT+declared}" ]]; then
        if [[ -z "${CONTAINER_ENTRYPOINT}" ]]; then
          buildah config --entrypoint '[]' "${BASE_CONTAINER}"
          echo "Cleared inherited container ENTRYPOINT"
        else
          buildah config --entrypoint "${CONTAINER_ENTRYPOINT}" "${BASE_CONTAINER}"
          echo "Set container ENTRYPOINT to: ${CONTAINER_ENTRYPOINT}"
        fi
      fi
    - |
      if [[ -n "${CONTAINER_CMD}" ]]; then
        buildah config --cmd "${CONTAINER_CMD}" "${BASE_CONTAINER}"
      fi
    - rm -f ${CONTAINER_MOUNT}/etc/dnf/protected.d/systemd.conf
    - rm -f ${CONTAINER_MOUNT}/etc/dnf/protected.d/pam.conf
    - rm -f ${CONTAINER_MOUNT}/etc/dnf/protected.d/bash.conf
    - |
      if [[ -n "${REQUIRED_PKGS}" ]]; then
        EXCLUDE_PKG_ARG="--exclude=$(echo "${REQUIRED_PKGS}" | tr -s ' \n' ',' | sed 's/^,*//;s/,*$//')"
      fi
    - dnf remove -y --setopt=protected_packages="" ${DNF_INSTALLROOT_ARG} ${EXCLUDE_PKG_ARG} microdnf ${FORCE_REMOVE_PKGS}
    - dnf repoquery --installed ${DNF_INSTALLROOT_ARG} > "./${INSTALLED_PCKG_FILE_NAME}" 2>/dev/null
    - >
      run_in_container_mount "
      rm -rf \
        /usr/share/{doc,man,info,locale,zoneinfo,i18n,icons,pixmaps,backgrounds}/* \
        /var/cache/{dnf,yum}/* /var/lib/dnf/* /var/lib/yum/* \
        /tmp/* /var/tmp/* \
        /etc/yum.repos.d/* /etc/dnf/modules.d/* /etc/rhsm /var/lib/rhsm \
        /etc/systemd /usr/lib/systemd /lib/systemd \
        /etc/pam.d /etc/security /usr/lib/security \
        /usr/bin/{dnf,yum,microdnf,rpm}
      "
    - buildah config --user 10001:10001 "${BASE_CONTAINER}"
    - buildah umount "${BASE_CONTAINER}"
    - buildah commit --squash "${BASE_CONTAINER}" "${IMAGE_NAME}"
    - podman save "${IMAGE_NAME}" | gzip > "${IMAGE_TAR_FILE_NAME}"
    - echo "Installed Packages:"
    - cat ${PROJECT_PATH}/${INSTALLED_PCKG_FILE_NAME}
  artifacts:
    name: Image Tar
    expose_as: Image Tar
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${IMAGE_TAR_FILE_NAME}
      - ${PROJECT_PATH}/${INSTALLED_PCKG_FILE_NAME}
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job