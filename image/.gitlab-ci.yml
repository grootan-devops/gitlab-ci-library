.image-load: &image-load
  - IMAGE_LOAD_NAME=$(docker load --input ${IMAGE_TAR_FILE_NAME} | awk '{print $3}')

.image-registry-login:
  before_script:
    - cd ${PROJECT_PATH}
    - !reference [.registry-functions, script]
    - registry_image_defaults
    - registry_primary_target image "${IMAGE_REPOSITORY}" || exit 1
    - >
      echo Authenticating Registry: ${REGISTRY_PRIMARY}
    - registry_dependency_proxy_login
    - |
      if [[ -n "${REGISTRY_PRIMARY}" ]]; then
        registry_resolve image "${IMAGE_REPOSITORY}" || exit 1
        if ! registry_login docker 0; then
          echo "   Set IMAGE_REGISTRY_USERNAME/IMAGE_REGISTRY_PASSWORD (e.g. a deploy token with read_registry+write_registry scope on the target project) as CI/CD variables, or the registry's credentials in the REGISTRY_CONFIG group."
          echo "   CI_JOB_TOKEN only authenticates against this project's own registry (or a target project that explicitly allowlists it) — it will not work for an unrelated registry namespace."
          exit 1
        fi
      fi

.image-common:
  variables:
    IGNORED_CVES_YQ_PATH: image
    DOCKER_BUILDKIT: 1
  services:
    - name: ${DOCKER_DIND_IMAGE_REPO}:${DOCKER_DIND_IMAGE_TAG}
      entrypoint: ["dockerd-entrypoint.sh", "--tls=false"]
      alias: docker

.Image:Test:
  stage: qa
  extends:
    - .image-common
    - .image-build-workflow-rules
  variables:
    TEST_SCRIPT: ${PROJECT_PATH}/${IMAGE_TEST_SCRIPT_FILE_NAME}
    TEST_IMAGE_SHELL: bash
    TEST_PATH: ""
  script:
    - *image-load
    - |
      if [[ -n "${TEST_PATH}" ]]; then
        docker run -a STDOUT -a STDERR --rm -v "${PWD}/${TEST_PATH}:/tmp/" --entrypoint "${TEST_IMAGE_SHELL}" ${IMAGE_LOAD_NAME} -c "cd /tmp/; ./${TEST_SCRIPT}"
      elif [[ -z "${TEST_IMAGE_SHELL}" ]]; then
        docker run -a STDOUT -a STDERR --rm -v "${PWD}/${TEST_SCRIPT%/*}:/${IMAGE_TEST_SCRIPT_FILE_NAME}" --entrypoint "${TEST_IMAGE_SHELL}" ${IMAGE_LOAD_NAME} -- "/${IMAGE_TEST_SCRIPT_FILE_NAME}"
      else
        echo "IMAGE_TEST_SCRIPT nor IMAGE_TEST_PATH environment variable found. Either one of them is required to run the tests else remove the job"
      fi
  needs:
    - job: Image:Build
      artifacts: true
      optional: true

Image:Check Existence:
  extends:
    - .image-common
    - .check-job-common
    - .image-registry-login
    - .image-check-rules
  script:
    - CHECK_TAG="${TARGET_VERSION:-${RELEASE_VERSION}}"
    - registry_resolve image "${IMAGE_REPOSITORY}" || exit 1
    # A scan target must exist in the primary repository. A release tag must
    # not exist in any repository, because the release is copied to every one.
    - |
      CHECK_COUNT=${#REGISTRY_HOSTS[@]}
      if [[ "${WORKFLOW}" == "image-scan" ]]; then
        CHECK_COUNT=1
      fi
      TAKEN=()
      UNCHECKED=()
      for ((I = 0; I < CHECK_COUNT; I++)); do
        HOST="${REGISTRY_HOSTS[${I}]}"
        if [[ "${CHECK_TAG}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          IMAGE_CHECK_REPO="${REGISTRY_REPOS[${I}]}"
        else
          IMAGE_CHECK_REPO="$(registry_dev_repository image "${HOST}" "${REGISTRY_REPOS[${I}]}" "${IMAGE_DEV_REPOSITORY_SUFFIX}")"
        fi
        if [[ ${I} -gt 0 ]] && ! registry_login docker "${I}"; then
          UNCHECKED+=("${HOST}/${IMAGE_CHECK_REPO}")
          continue
        fi
        echo "Checking image tag '${CHECK_TAG}' in ${HOST}/${IMAGE_CHECK_REPO}..."
        if docker manifest inspect "${HOST}/${IMAGE_CHECK_REPO}:${CHECK_TAG}" > /dev/null 2>&1; then
          RESULT=0
        else
          RESULT=1
        fi
        if [[ "${WORKFLOW}" == "image-scan" ]]; then
          if [[ ${RESULT} -ne 0 ]]; then
            echo "❌ Image tag '${CHECK_TAG}' not found in registry ${HOST}/${IMAGE_CHECK_REPO}."
            exit 1
          else
            echo "✅ Image tag '${CHECK_TAG}' exists in registry. Ready for scanning."
          fi
        elif [[ ${RESULT} -eq 0 ]]; then
          if [[ ${CHECK_COUNT} -gt 1 ]]; then
            IMAGE_CHECK_REPO="${HOST}/${IMAGE_CHECK_REPO}"
          fi
          echo "❌ Image with tag '${CHECK_TAG}' already exists in ${IMAGE_CHECK_REPO}."
          TAKEN+=("${HOST}")
        fi
      done
      if [[ ${#UNCHECKED[@]} -gt 0 ]]; then
        UNCHECKED_TEXT="$(printf '%s, ' "${UNCHECKED[@]}")"
        echo "❌ Image tag '${CHECK_TAG}' could not be checked in: ${UNCHECKED_TEXT%, }."
      fi
      if [[ ${#TAKEN[@]} -gt 0 || ${#UNCHECKED[@]} -gt 0 ]]; then
        exit 1
      fi
      if [[ "${WORKFLOW}" != "image-scan" ]]; then
        echo "✅ Image tag '${CHECK_TAG}' is available."
      fi
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
    - job: Common:Init
      artifacts: true
      optional: true

Image:Push:
  stage: push
  extends:
    - .image-common
    - .image-registry-login
    - .image-build-workflow-rules
  script:
    - echo "Pushing image to ${IMAGE_PUSH_REPOSITORY}"
    - *image-load
    - registry_resolve image "${IMAGE_REPOSITORY}" || exit 1
    - PUSHED=()
    - FAILED=()
    - |
      for I in "${!REGISTRY_HOSTS[@]}"; do
        HOST="${REGISTRY_HOSTS[${I}]}"
        PUSH_REPO="$(registry_dev_repository image "${HOST}" "${REGISTRY_REPOS[${I}]}" "${IMAGE_REPOSITORY_SUFFIX}")"
        if [[ ${I} -gt 0 ]] && ! registry_login docker "${I}"; then
          FAILED+=("${HOST}/${PUSH_REPO}")
          continue
        fi
        if docker tag ${IMAGE_LOAD_NAME} "${HOST}/${PUSH_REPO}:${APP_PUSH_VERSION}" && docker push "${HOST}/${PUSH_REPO}:${APP_PUSH_VERSION}"; then
          PUSHED+=("${I}")
        else
          FAILED+=("${HOST}/${PUSH_REPO}")
        fi
      done
    - |
      {
        echo "### 🐳 Container Image Registry Info"
        echo '```'
        docker image ls --format '{{.Repository}}:{{.Tag}}@{{.Digest}}' | sed '/<none>/d'
        echo '```'
      } > "${IMAGE_INFO_FILE_NAME}"
    - |
      for I in "${PUSHED[@]}"; do
        HOST="${REGISTRY_HOSTS[${I}]}"
        PUSH_TARGET="${HOST}/$(registry_dev_repository image "${HOST}" "${REGISTRY_REPOS[${I}]}" "${IMAGE_REPOSITORY_SUFFIX}"):${APP_PUSH_VERSION}"
        DEV_TARGET="${HOST}/$(registry_dev_repository image "${HOST}" "${REGISTRY_REPOS[${I}]}" "${IMAGE_DEV_REPOSITORY_SUFFIX}"):${APP_PUSH_VERSION}"
        if [[ "${PUSH_TARGET}" != "${DEV_TARGET}" ]]; then
          if ! { docker tag ${IMAGE_LOAD_NAME} "${DEV_TARGET}" && docker push "${DEV_TARGET}"; }; then
            FAILED+=("${DEV_TARGET%:*}")
          fi
        fi
      done
    - |
      if [[ ${#FAILED[@]} -gt 0 ]]; then
        FAILED_TEXT="$(printf '%s, ' "${FAILED[@]}")"
        echo "❌ ERROR: The image was not pushed to: ${FAILED_TEXT%, }. Every repository was tried; re-run once they are fixed."
        exit 1
      fi
  artifacts:
    name: Image SHA List
    expose_as: Image SHA List
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${IMAGE_INFO_FILE_NAME}
  needs:
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Image:Build
      artifacts: true
      optional: false

Image:Scan:
  variables:
    TRIVY_SCAN_REPORT_NAME_PREFIX: image
    TRIVY_SCAN_REPORT_NAME: ${TRIVY_SCAN_REPORT_NAME_PREFIX}_${TRIVY_SCAN_REPORT_NAME_SUFFIX}
    SCAN_TYPE: image
  extends:
    - .image-common
    - .image-registry-login
    - .scan-script
    - .image-scan-workflow-rules
  needs:
    - job: Workflow:Validate:Variables
      artifacts: false
      optional: true
    - job: Common:Init
      artifacts: true
      optional: true
    - job: Image:Build
      artifacts: true
      optional: true
    - job: Trivy:Cache:Warm
      artifacts: false
      optional: true
  cache:
    - key: trivy-db
      when: always
      policy: pull
      paths:
        - ${CI_PROJECT_DIR}/.trivycache
  artifacts:
    name: Image Scan Report
    expose_as: Image Scan Report
    when: always
    expire_in: 1 week
    paths:
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.md
      - ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.json
      - ${PROJECT_PATH}/${IMAGE_CVE_INFO_FILE_NAME}
    reports:
      junit: ${PROJECT_PATH}/${TRIVY_SCAN_REPORT_NAME}.junit

Image:Promote:
  stage: release
  extends:
    - .release-rules
    - .image-common
    - .image-registry-login
  needs:
    - job: Common:Init
      artifacts: true
      optional: false
  script:
    - registry_resolve image "${IMAGE_REPOSITORY}" || exit 1
    - DEV_IMAGE="${REGISTRY_PRIMARY}/$(registry_dev_repository image "${REGISTRY_PRIMARY}" "${REGISTRY_REPOS[0]}" "${IMAGE_DEV_REPOSITORY_SUFFIX}")"
    - PROD_IMAGE="${REGISTRY_PRIMARY}/${REGISTRY_REPOS[0]}"
    - echo "🔍 Looking for candidate image in dev registry -> ${DEV_IMAGE} (target version ${TAG})..."
    - |
      DEV_IMAGE_SRC=""
      # 1. Try explicit dev candidate version from upstream MR verification pipeline
      if [[ -n "${DEV_CANDIDATE_VERSION}" ]] && crane manifest "${DEV_IMAGE}:${DEV_CANDIDATE_VERSION}" > /dev/null 2>&1; then
        DEV_IMAGE_SRC="${DEV_IMAGE}:${DEV_CANDIDATE_VERSION}"
      # 2. Try candidate tag with ${TAG}-rc.${UPSTREAM_PIPELINE_ID}
      elif [[ -n "${UPSTREAM_PIPELINE_ID}" ]] && crane manifest "${DEV_IMAGE}:${TAG}-rc.${UPSTREAM_PIPELINE_ID}" > /dev/null 2>&1; then
        DEV_IMAGE_SRC="${DEV_IMAGE}:${TAG}-rc.${UPSTREAM_PIPELINE_ID}"
      # 3. Dynamic lookup for latest RC tag for this version in dev registry
      else
        RC_TAG=$(crane ls "${DEV_IMAGE}" 2>/dev/null | grep -E "^${TAG}-rc" | sort -V | tail -n1 || true)
        if [[ -n "${RC_TAG}" ]] && crane manifest "${DEV_IMAGE}:${RC_TAG}" > /dev/null 2>&1; then
          DEV_IMAGE_SRC="${DEV_IMAGE}:${RC_TAG}"
        elif crane manifest "${DEV_IMAGE}:${TAG}" > /dev/null 2>&1; then
          DEV_IMAGE_SRC="${DEV_IMAGE}:${TAG}"
        fi
      fi
    - |
      if [[ -n "${DEV_IMAGE_SRC}" ]]; then
        echo "📦 Found candidate dev image: ${DEV_IMAGE_SRC}"
        echo "🏷️ Mutating label 'org.opencontainers.image.version=${TAG}' and promoting to ${PROD_IMAGE}:${TAG}..."
        crane mutate "${DEV_IMAGE_SRC}" --label "org.opencontainers.image.version=${TAG}" --tag "${PROD_IMAGE}:${TAG}"
        echo "🚀 Tagging release aliases in production registry..."
        crane tag "${PROD_IMAGE}:${TAG}" latest
        MAJOR_VERSION=$(echo "${TAG}" | grep -Eo '^([0-9]+)')
        MINOR_VERSION=$(echo "${TAG}" | grep -Eo '^([0-9]+)\.([0-9]+)')
        if [[ -n "${MAJOR_VERSION}" ]]; then
          crane tag "${PROD_IMAGE}:${TAG}" "${MAJOR_VERSION}"
        fi
        if [[ -n "${MINOR_VERSION}" ]]; then
          crane tag "${PROD_IMAGE}:${TAG}" "${MINOR_VERSION}"
        fi
        echo "✅ Production image promoted successfully via Crane."
        if [[ ${#REGISTRY_HOSTS[@]} -gt 1 ]]; then
          PROMOTED_DIGEST="$(crane digest "${PROD_IMAGE}:${TAG}")"
          RELEASE_ALIASES=(latest)
          if [[ -n "${MAJOR_VERSION}" ]]; then
            RELEASE_ALIASES+=("${MAJOR_VERSION}")
          fi
          if [[ -n "${MINOR_VERSION}" ]]; then
            RELEASE_ALIASES+=("${MINOR_VERSION}")
          fi
          COPY_STATUS=0
          registry_copy_image "${PROD_IMAGE}" "${PROMOTED_DIGEST}" "${TAG}" "${RELEASE_ALIASES[@]}" || COPY_STATUS=$?
          if [[ ${COPY_STATUS} -ne 0 ]]; then
            COPY_FAILED_TEXT="$(printf '%s, ' "${REGISTRY_COPY_FAILED[@]}")"
            echo "❌ ERROR: ${PROD_IMAGE}:${TAG} was promoted but not copied to: ${COPY_FAILED_TEXT%, }. Every repository was tried; re-run once they are fixed."
            exit 1
          fi
        fi
      else
        echo "⚠️ Notice: No candidate dev image found. Skipping image promotion."
      fi
